<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그랑서울 피트니스 · 고을 지도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
:root{
  --ink:#1C1C1A;
  --ink-soft:#5F5E5A;
  --ivory:#EDE6D6;
  --ivory-light:#F7F5F0;
  --paper2:#E3DBC8;
  --teal:#0F6E56;
  --orange:#D85A30;
  --gold:#AD8A45;
  --hanok-red:#7C2E22;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Gowun Batang',serif;
  background:var(--ivory-light);
  color:var(--ink);
  display:flex;
  justify-content:center;
}
.app{
  width:100%;
  max-width:420px;
  min-height:100vh;
  background:var(--ivory-light);
  position:relative;
  overflow:hidden;
}
.screen{display:none;min-height:100vh;flex-direction:column;position:relative;}
.screen.active{display:flex;}

/* ---------- Map screen ---------- */
#map{padding:0;background:#DED6C4;}
.village-wrap{position:relative;width:100%;}
.village-wrap img.hero{width:100%;display:block;}

.zone-hit{
  position:absolute;
  display:block;
  cursor:pointer;
}
.zone-hit:active{opacity:0.7;}

/* ---------- Status overlay: sits inside the baked-in mission panel's empty slots ---------- */
.char-block{
  position:absolute;
  left:9.8%;top:80.6%;width:16.5%;
  display:flex;
  justify-content:center;
}
.speech-bubble{
  position:absolute;
  left:50%;
  bottom:100%;
  transform:translateX(-50%);
  margin-bottom:6px;
  background:#FBF9F4;
  border:1.3px solid #9C9990;
  border-radius:10px;
  padding:4px 7px;
  font-size:8.5px;
  font-weight:700;
  text-align:center;
  width:max-content;
  max-width:100px;
  line-height:1.25;
  cursor:pointer;
  user-select:none;
  transition:transform .12s ease;
}
.speech-bubble:active{transform:translateX(-50%) scale(0.94);}
.speech-bubble::after{
  content:'';
  position:absolute;
  left:50%;bottom:-5px;
  transform:translateX(-50%);
  width:0;height:0;
  border-left:4px solid transparent;
  border-right:4px solid transparent;
  border-top:5px solid #9C9990;
}
.speech-bubble::before{
  content:'';
  position:absolute;
  left:50%;bottom:-3.5px;
  transform:translateX(-50%);
  width:0;height:0;
  border-left:3.2px solid transparent;
  border-right:3.2px solid transparent;
  border-top:3.7px solid #FBF9F4;
  z-index:1;
}
.char-mini{
  width:100%;
  animation:charMiniBob 2.8s ease-in-out infinite;
}
@keyframes charMiniBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
.char-mini svg{width:100%;height:auto;overflow:visible;}
.char-mini .outfit-group{display:none;}
.char-mini .outfit-group.show{display:block;}
.char-mini .hat-group{opacity:0;transition:opacity .2s ease;}
.char-mini .hat-group.show{opacity:1;}

.dday-num{
  position:absolute;
  left:55.3%;top:82.3%;width:9.4%;height:2%;
  display:flex;align-items:center;justify-content:center;
  color:#FFFFFF;
  font-weight:700;
  font-size:11px;
  letter-spacing:0.3px;
}
.progress-track{
  position:absolute;
  left:31.5%;top:85.5%;width:48%;height:1.05%;
  border-radius:20px;
  overflow:hidden;
}
.progress-fill{
  height:100%;width:0%;
  background:#B84E14;
  border-radius:20px;
  transition:width .4s ease;
}
.progress-count{
  position:absolute;
  left:81%;top:85.3%;width:14%;height:1.5%;
  display:flex;align-items:center;
  color:var(--ink);
  font-weight:700;
  font-size:12px;
}

/* ---------- Mission list screen ---------- */
#missions{padding:0;}
.mission-wrap{position:relative;width:100%;}
.mission-wrap img.hero{width:100%;display:block;}
.mission-back{
  position:absolute;
  left:4%;top:2.6%;width:40%;height:3.6%;
  display:block;
  cursor:pointer;
}
.mission-back:active{opacity:0.6;}

.mission-list{
  position:absolute;
  left:16.2%;top:25.9%;width:68%;
  display:flex;flex-direction:column;gap:5%;
}
.mission-item{
  position:relative;
  width:100%;
  aspect-ratio:764/273;
  background-image:url('https://raw.githubusercontent.com/gran-seoul-fitness/10-/claude/happy-wozniak-zu6wr0/images/health/mission_card.png');
  background-size:100% 100%;
  background-repeat:no-repeat;
  cursor:pointer;
  transition:transform .12s ease;
}
.mission-item:active{transform:scale(0.98);}
.mission-icon{
  position:absolute;
  left:6.5%;top:28.6%;width:15.2%;height:45.1%;
  border-radius:24%;
  display:flex;align-items:center;justify-content:center;
  color:#FBF9F4;font-size:15px;font-weight:700;
  background:transparent;
  transition:background .15s ease;
}
.mission-item.done .mission-icon{background:var(--teal);}
.mission-badge{
  position:absolute;
  left:23.9%;top:26%;width:25.9%;height:15.4%;
  display:flex;align-items:center;justify-content:center;
  color:#F7F5F0;font-size:8px;font-weight:700;
  letter-spacing:0.2px;
  white-space:nowrap;
}
.mission-name-bar{
  position:absolute;
  left:26%;top:45.1%;width:53%;height:28.6%;
  display:flex;align-items:center;
  font-size:12px;font-weight:700;color:#2A2320;
  transition:color .15s ease;
  overflow:hidden;
}
.mission-item.done .mission-name-bar{
  color:rgba(42,35,32,0.55);
  text-decoration:line-through;
}
.mission-item.done::after{
  content:'';
  position:absolute;
  left:23.9%;top:45.1%;width:56.5%;height:28.6%;
  background:rgba(255,255,255,0.4);
  border-radius:8px;
  pointer-events:none;
}
</style>
</head>

<script>
const missionIcons = {
  stretch: `<svg viewBox="0 0 24 24" fill="none" stroke="#FBF9F4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><circle cx="12" cy="4.5" r="2" fill="#FBF9F4" stroke="none"/><path d="M12 7v6M12 9l-5 3M12 9l5 3M12 13l-3 7M12 13l3 7"/></svg>`,
  gx: `<svg viewBox="0 0 24 24" fill="none" stroke="#FBF9F4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><circle cx="12" cy="4.5" r="2" fill="#FBF9F4" stroke="none"/><path d="M12 7v5M12 8l-5-3M12 8l5-3M12 12l-4 8M12 12l4 8"/></svg>`,
  strength: `<svg viewBox="0 0 24 24" width="24" height="24"><rect x="1.5" y="9.5" width="4" height="5" rx="1.2" fill="#FBF9F4"/><rect x="18.5" y="9.5" width="4" height="5" rx="1.2" fill="#FBF9F4"/><rect x="4.5" y="11" width="15" height="2" fill="#FBF9F4"/></svg>`,
  cardio: `<svg viewBox="0 0 24 24" fill="none" stroke="#FBF9F4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><circle cx="15" cy="4.5" r="2" fill="#FBF9F4" stroke="none"/><path d="M4 20l4-5 3 2 3-6 2 3h4"/><path d="M11 11l2-3-3-2-2 3 2 2z" fill="#FBF9F4" stroke="none"/></svg>`
};

const GH_RAW = 'https://raw.githubusercontent.com/gran-seoul-fitness/10-/claude/happy-wozniak-zu6wr0/images/health/';
const zones = {
  stretch: { name:'스트레칭', color:'#AD8A45', bg: GH_RAW + 'mission_stretch_bg.png', missions:['매트 전신 스트레칭','고관절 모빌리티','폼롤러 스트레칭'] },
  gx: { name:'그룹운동', color:'#D85A30', bg: GH_RAW + 'mission_gx_bg.png', missions:['요가','줌바','필라테스'] },
  strength: { name:'근력', color:'#1C1C1A', bg: GH_RAW + 'mission_strength_bg.png', missions:['스쿼트','데드리프트','벤치프레스'] },
  cardio: { name:'유산소', color:'#0F6E56', bg: GH_RAW + 'mission_cardio_bg.png', missions:['트레드밀 걷기','사이클 타기','줄넘기'] }
};

const ordinalKo = ['첫 번째','두 번째','세 번째','네 번째','다섯 번째','여섯 번째'];

function goTo(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
  if(id === 'map') updateProgressUI();
}

let currentZoneKey = null;

document.querySelectorAll('.zone-hit[data-zone]').forEach(zoneEl=>{
  zoneEl.addEventListener('click', ()=>{
    const key = zoneEl.dataset.zone;
    currentZoneKey = key;
    const z = zones[key];
    document.getElementById('missionHero').src = z.bg;
    renderMissionList(key);
    goTo('missions');
  });
});

function renderMissionList(key){
  const z = zones[key];
  const done = getDoneSet();
  const list = document.getElementById('missionList');
  list.innerHTML = '';
  z.missions.forEach((m,i)=>{
    const missionKey = key + '-' + i;
    const isDone = !!done[missionKey];
    const ordinal = ordinalKo[i] || `${i+1}번째`;
    const item = document.createElement('div');
    item.className = 'mission-item' + (isDone ? ' done' : '');
    item.dataset.key = missionKey;
    item.innerHTML = `
      <div class="mission-icon">${isDone ? '✓' : missionIcons[key]}</div>
      <div class="mission-badge">미션 ${ordinal}</div>
      <div class="mission-name-bar">${m}</div>`;
    list.appendChild(item);
  });
}

document.getElementById('missionList').addEventListener('click', (e)=>{
  const item = e.target.closest('.mission-item');
  if(!item) return;
  const key = item.dataset.key;
  const done = getDoneSet();
  const nowDone = !done[key];
  setDone(key, nowDone);
  item.classList.toggle('done', nowDone);
  const zoneKey = key.split('-')[0];
  item.querySelector('.mission-icon').innerHTML = nowDone ? '✓' : missionIcons[zoneKey];
  updateProgressUI();
});

/* ---------- Mission progress (localStorage) ---------- */
function getDoneSet(){
  try{ return JSON.parse(localStorage.getItem('gsf_missions_done') || '{}'); }
  catch(e){ return {}; }
}
function setDone(key, val){
  const done = getDoneSet();
  if(val) done[key] = true; else delete done[key];
  try{ localStorage.setItem('gsf_missions_done', JSON.stringify(done)); }catch(e){}
}
function totalMissionCount(){
  return Object.values(zones).reduce((sum,z)=>sum+z.missions.length, 0);
}
function updateProgressUI(){
  const total = totalMissionCount();
  const done = Object.keys(getDoneSet()).length;
  document.getElementById('progressCount').textContent = `${done}/${total}`;
  document.getElementById('progressFill').style.width = (total ? done/total*100 : 0) + '%';
}

/* ---------- Character (restored from health_challenge.html's choice) ---------- */
const hatElsMini = { gat: document.getElementById('hatGatMini'), binyeo: document.getElementById('hatBinyeoMini') };
const outfitElsMini = { gym: document.getElementById('outfitGymMini'), chima: document.getElementById('outfitChimaMini'), baji: document.getElementById('outfitBajiMini') };

function restoreCharacterMini(){
  let hatKey, outfitKey;
  try{
    hatKey = localStorage.getItem('gsf_hat');
    outfitKey = localStorage.getItem('gsf_outfit');
  }catch(e){}
  Object.values(hatElsMini).forEach(el=>el.classList.remove('show'));
  if(hatKey && hatElsMini[hatKey]) hatElsMini[hatKey].classList.add('show');
  Object.values(outfitElsMini).forEach(el=>el.classList.remove('show'));
  outfitElsMini[(outfitKey && outfitElsMini[outfitKey]) ? outfitKey : 'gym'].classList.add('show');
}

  '한 존씩 차근차근!',

  '오늘 미션 하나만 더 해볼까요?',
  '꾸준함이 최고의 운동이에요',
  '오늘의 나는 어제보다 강해요',
  '잠깐이라도 몸을 움직여봐요',
  '고을 한 바퀴 돌아볼까요?',

  '작은 습관이 큰 변화를 만들어요'

let speechIndex = 0;
const speechBubbleEl = document.getElementById('speechBubble');
speechBubbleEl.addEventListener('click', ()=>{
  speechIndex = (speechIndex + 1) % speechPhrases.length;
  speechBubbleEl.textContent = speechPhrases[speechIndex];
});

/* ---------- D-day ---------- */
const CHALLENGE_END = new Date('2026-10-31T23:59:59+09:00');
function updateDday(){
  const now = new Date();
  const diffDays = Math.ceil((CHALLENGE_END - now) / 86400000);
  document.getElementById('ddayBadge').textContent = diffDays > 0 ? `D-${diffDays}` : 'D-DAY';
}

updateDday();
updateProgressUI();
restoreCharacterMini();
</script>
