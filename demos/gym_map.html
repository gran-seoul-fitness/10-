<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그랑서울 피트니스 · 고을 지도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
:root{
  --ink:#1C1C1A;
  --ink-soft:#5F5E5A;
  --ivory:#EDE6D6;
  --ivory-light:#F7F5F0;
  --paper2:#E3DBC8;
  --teal:#0F6E56;
  --orange:#D85A30;
  --gold:#AD8A45;
  --hanok-red:#7C2E22;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Gowun Batang',serif;
  background:var(--ivory-light);
  color:var(--ink);
  display:flex;
  justify-content:center;
}
.app{
  width:100%;
  max-width:420px;
  min-height:100vh;
  background:var(--ivory-light);
  position:relative;
  overflow:hidden;
}
.screen{display:none;min-height:100vh;flex-direction:column;position:relative;}
.screen.active{display:flex;}

/* ---------- Map screen ---------- */
#map{padding:0;background:#DED6C4;}
.village-wrap{position:relative;width:100%;}
.village-wrap img.hero{width:100%;display:block;}

.zone-hit{
  position:absolute;
  display:block;
  cursor:pointer;
}
.zone-hit:active{opacity:0.7;}

/* ---------- Status overlay: sits inside the baked-in mission panel's empty slots ---------- */
.char-block{
  position:absolute;
  left:9.8%;top:80.6%;width:16.5%;
  display:flex;
  justify-content:center;
}
.speech-bubble{
  position:absolute;
  left:50%;
  bottom:100%;
  transform:translateX(-50%);
  margin-bottom:6px;
  background:#FBF9F4;
  border:1.3px solid #9C9990;
  border-radius:10px;
  padding:4px 7px;
  font-size:8.5px;
  font-weight:700;
  text-align:center;
  width:max-content;
  max-width:100px;
  line-height:1.25;
  cursor:pointer;
  user-select:none;
  transition:transform .12s ease;
}
.speech-bubble:active{transform:translateX(-50%) scale(0.94);}
.speech-bubble::after{
  content:'';
  position:absolute;
  left:50%;bottom:-5px;
  transform:translateX(-50%);
  width:0;height:0;
  border-left:4px solid transparent;
  border-right:4px solid transparent;
  border-top:5px solid #9C9990;
}
.speech-bubble::before{
  content:'';
  position:absolute;
  left:50%;bottom:-3.5px;
  transform:translateX(-50%);
  width:0;height:0;
  border-left:3.2px solid transparent;
  border-right:3.2px solid transparent;
  border-top:3.7px solid #FBF9F4;
  z-index:1;
}
.char-mini{
  width:100%;
  animation:charMiniBob 2.8s ease-in-out infinite;
}
@keyframes charMiniBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
.char-mini svg{width:100%;height:auto;overflow:visible;}
.char-mini .outfit-group{display:none;}
.char-mini .outfit-group.show{display:block;}
.char-mini .hat-group{opacity:0;transition:opacity .2s ease;}
.char-mini .hat-group.show{opacity:1;}

.dday-num{
  position:absolute;
  left:55.3%;top:82.3%;width:9.4%;height:2%;
  display:flex;align-items:center;justify-content:center;
  color:#FFFFFF;
  font-weight:700;
  font-size:11px;
  letter-spacing:0.3px;
}
.progress-track{
  position:absolute;
  left:31.5%;top:85.5%;width:48%;height:1.05%;
  border-radius:20px;
  overflow:hidden;
}
.progress-fill{
  height:100%;width:0%;
  background:#B84E14;
  border-radius:20px;
  transition:width .4s ease;
}
.progress-count{
  position:absolute;
  left:81%;top:85.3%;width:14%;height:1.5%;
  display:flex;align-items:center;
  color:var(--ink);
  font-weight:700;
  font-size:12px;
}

/* ---------- Mission list screen ---------- */
#missions{padding:0;}
.mission-wrap{position:relative;width:100%;}
.mission-wrap img.hero{width:100%;display:block;}
.mission-back{
  position:absolute;
  left:4%;top:2.6%;width:40%;height:3.6%;
  display:block;
  cursor:pointer;
}
.mission-back:active{opacity:0.6;}

.mission-list{
  position:absolute;
  left:16.2%;top:25.9%;width:68%;
  display:flex;flex-direction:column;gap:8%;
}
.mission-item{
  position:relative;
  width:100%;
  aspect-ratio:764/273;
  background-image:url('https://raw.githubusercontent.com/gran-seoul-fitness/10-/claude/happy-wozniak-zu6wr0/images/health/mission_card.png');
  background-size:100% 100%;
  background-repeat:no-repeat;
  cursor:pointer;
  transition:transform .12s ease;
}
.mission-item:active{transform:scale(0.98);}
.mission-icon{
  position:absolute;
  left:6.5%;top:28.6%;width:15.2%;height:45.1%;
  border-radius:24%;
  display:flex;align-items:center;justify-content:center;
  color:#FBF9F4;font-size:15px;font-weight:700;
  background:transparent;
  transition:background .15s ease;
}
.mission-badge{
  position:absolute;
  left:23.9%;top:26%;width:25.9%;height:15.4%;
  display:flex;align-items:center;justify-content:center;
  color:#F7F5F0;font-size:8px;font-weight:700;
  letter-spacing:0.2px;
  white-space:nowrap;
}
.mission-name-bar{
  position:absolute;
  left:26%;top:45.1%;width:53%;height:28.6%;
  display:flex;align-items:center;
  font-size:12px;font-weight:700;color:#2A2320;
  transition:color .15s ease;
  overflow:hidden;
}
.mission-item.done .mission-icon,
.mission-item.done .mission-badge,
.mission-item.done .mission-name-bar{
  visibility:hidden;
}
.mission-item.done::after{
  content:'미션 완료';
  position:absolute;
  inset:0;
  background:rgba(36,15,12,0.73);
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  color:#F7F5F0;font-size:15px;font-weight:700;
  letter-spacing:0.4px;
  pointer-events:none;
}

/* ---------- Mission popup ---------- */
.popup-overlay{
  display:none;
  position:absolute;
  left:0;top:0;width:100%;height:100%;
  background:rgba(12,11,10,0.86);
  z-index:20;
  align-items:center;
  justify-content:center;
  padding:0 8%;
}
.popup-overlay.show{display:flex;}
.popup-card{
  position:relative;
  width:100%;
  aspect-ratio:1080/1254;
  background-image:url('https://raw.githubusercontent.com/gran-seoul-fitness/10-/claude/happy-wozniak-zu6wr0/images/health/mission_popup.png');
  background-size:100% 100%;
  background-repeat:no-repeat;
}
.popup-header{
  position:absolute;
  left:6%;top:6%;width:85%;
  color:#8A8680;font-size:10.5px;font-weight:700;
  letter-spacing:0.2px;
}
.popup-gallery{
  position:absolute;
  left:5.5%;top:9.5%;width:89%;height:42%;
  display:flex;gap:6px;overflow-x:auto;
  border-radius:6px;
}
.popup-gallery::-webkit-scrollbar{display:none;}
.popup-gallery-item{
  position:relative;flex:0 0 auto;height:100%;
  border-radius:6px;overflow:hidden;
  background:#EDE8DD;
}
.popup-gallery-item img{width:100%;height:100%;object-fit:cover;display:block;}
.popup-gallery-item span{
  position:absolute;left:5px;bottom:5px;
  background:rgba(20,18,16,0.72);color:#F7F5F0;
  font-size:8px;font-weight:700;padding:3px 7px;border-radius:20px;
  white-space:nowrap;
}
.popup-badge{
  position:absolute;
  left:5.5%;top:56%;
  background:#3A3835;
  border-radius:9px;
  display:inline-flex;align-items:center;justify-content:center;
  color:#F7F5F0;font-size:18px;font-weight:700;
  padding:11px 18px;
  max-width:75%;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.popup-sets{
  position:absolute;
  left:5.5%;top:68.5%;width:70%;height:4.5%;
  display:flex;align-items:center;
  color:#3A3835;font-size:15px;font-weight:700;
}
.popup-verify-btn{
  position:absolute;
  left:9.9%;top:80.9%;width:80.1%;height:11.3%;
  background:none;border:none;cursor:pointer;
}
.popup-verify-btn.disabled::before{
  content:'오늘은 이미 인증했어요 · 내일 다시';
  position:absolute;inset:0;
  background:rgba(50,48,44,0.92);
  color:#F7F5F0;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  border-radius:14px;
}

/* ---------- Verify screen ---------- */
#verify{padding:0;background:var(--ivory-light);}
.verify-wrap{
  position:relative;
  width:100%;
}
.verify-wrap img.hero{width:100%;display:block;}
.verify-back{
  position:absolute;
  left:6%;top:2.8%;width:45%;height:2.4%;
  cursor:pointer;
}
.verify-back:active{opacity:0.6;}
.verify-badge{
  position:absolute;
  left:6.9%;top:42%;
  background:#3A3835;
  border-radius:7px;
  display:inline-flex;align-items:center;justify-content:center;
  color:#F7F5F0;font-size:16px;font-weight:700;
  padding:9px 14px;
  max-width:70%;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.verify-sets{
  position:absolute;
  left:6.9%;top:47.4%;width:60%;height:2.6%;
  display:flex;align-items:center;
  color:#3A3835;font-size:15px;font-weight:700;
}
.verify-subtitle{
  position:absolute;
  left:9.3%;top:16.85%;width:70%;height:2.3%;
  background:#EAE7DD;
  display:flex;align-items:center;
  color:rgba(60,56,48,0.85);font-size:13px;font-weight:500;
  white-space:nowrap;
}
.verify-gallery{
  position:absolute;
  left:6.94%;top:21.84%;width:86.4%;height:18.12%;
  display:flex;gap:6px;overflow-x:auto;
  border-radius:6px;
}
.verify-gallery::-webkit-scrollbar{display:none;}
.verify-gallery-item{
  position:relative;flex:0 0 auto;height:100%;
  border-radius:6px;overflow:hidden;
  background:#EDE8DD;
}
.verify-gallery-item img{width:100%;height:100%;object-fit:cover;display:block;}
.verify-gallery-item span{
  position:absolute;left:5px;bottom:5px;
  background:rgba(20,18,16,0.72);color:#F7F5F0;
  font-size:8px;font-weight:700;padding:3px 7px;border-radius:20px;
  white-space:nowrap;
}
.verify-photo{
  position:absolute;
  left:6.85%;top:52%;width:86.4%;height:31.6%;
  background:rgba(36,15,12,0.83);
  border:3px dashed rgba(247,245,240,0.28);
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-sizing:border-box;
}
.verify-photo img{width:100%;height:100%;object-fit:cover;display:none;}
.verify-photo.has-photo img{display:block;}
.verify-photo-placeholder{
  display:flex;flex-direction:column;align-items:center;gap:9px;
}
.verify-photo.has-photo .verify-photo-placeholder{display:none;}
.verify-photo-icon{
  width:44px;height:44px;
  border-radius:50%;
  background:rgba(247,245,240,0.1);
  display:flex;align-items:center;justify-content:center;
}
.verify-photo-icon svg{width:22px;height:22px;}
.verify-photo-title{
  color:#F7F5F0;font-size:13.5px;font-weight:700;
}
.verify-photo-subtitle{
  color:#9C9990;font-size:11px;font-weight:500;
}
.verify-checkbox-row{
  position:absolute;
  left:10%;top:85.04%;width:79.9%;height:3.2%;
  display:flex;align-items:center;gap:10px;
  padding:0 14px;
  pointer-events:none;
}
.verify-checkbox{
  flex-shrink:0;
  width:22px;height:22px;
  border:2px solid var(--ink);
  border-radius:5px;
  background:#FBF9F4;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  pointer-events:auto;
  transition:background .12s ease;
}
.verify-checkbox.checked{background:var(--teal);border-color:var(--teal);}
.verify-checkbox svg{width:70%;height:70%;display:none;}
.verify-checkbox.checked svg{display:block;}
.verify-checkbox-label{
  color:var(--ink);font-size:11.5px;font-weight:700;
}
.verify-complete-btn{
  position:absolute;
  left:10.1%;top:89.5%;width:80.1%;height:5.6%;
  background:#CE6A30;
  border:none;border-radius:14px;
  color:#FBF9F4;font-family:'Gowun Batang',serif;font-size:14px;font-weight:700;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(206,106,48,0.35);
}
.verify-complete-btn:active{transform:scale(0.98);}

/* ---------- Puzzle entry button (map screen) ---------- */
.puzzle-entry-btn{
  position:absolute;
  top:3%;right:4%;
  width:38px;height:38px;
  background:#FBF9F4;
  border:2px solid rgba(45,35,32,0.3);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
  cursor:pointer;
  box-shadow:0 3px 8px rgba(0,0,0,0.15);
  z-index:5;
}
.puzzle-entry-btn:active{transform:scale(0.92);}

/* ---------- Puzzle collection screen ---------- */
#puzzle{padding:0;background:var(--ivory-light);}
.puzzle-wrap{padding:22px 20px;}
.puzzle-back{display:block;margin-bottom:16px;color:var(--ink-soft);font-size:13px;font-weight:700;cursor:pointer;}
.puzzle-header h2{margin:0 0 4px;font-size:22px;color:var(--ink);}
.puzzle-sub{margin:0 0 22px;font-size:13px;color:var(--ink-soft);line-height:1.5;}
.puzzle-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  margin-bottom:18px;
}
.puzzle-slot{
  aspect-ratio:1/1;
  background:#EDE8DD;
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  padding:12px;
}
.puzzle-slot.filled{background:#F7F1E4;}
.puzzle-slot svg{width:100%;height:100%;}
.puzzle-slot-q{font-size:20px;font-weight:700;color:rgba(58,53,45,0.3);}
.puzzle-progress{text-align:center;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:18px;}
.puzzle-play-btn{
  width:100%;padding:14px;
  background:var(--orange);border:none;border-radius:14px;
  color:#FBF9F4;font-family:'Gowun Batang',serif;font-size:14px;font-weight:700;
  cursor:pointer;
}
.puzzle-play-btn:disabled{background:#C9C2B3;cursor:default;}
#puzzlePlay{padding:0;background:var(--ivory-light);}
.puzzle-play-wrap{padding:22px 20px;}
.puzzle-play-msg{padding:60px 10px;text-align:center;font-size:14px;color:var(--ink-soft);line-height:1.7;}

/* ---------- Mission-complete celebration overlay ---------- */
.celebrate-overlay{
  display:none;
  position:absolute;
  left:0;top:0;width:100%;height:100%;
  background:rgba(15,20,18,0.82);
  z-index:40;
  align-items:center;justify-content:center;
  overflow:hidden;
  padding:0 8%;
}
.celebrate-overlay.show{display:flex;}
.celebrate-particles{position:absolute;inset:0;pointer-events:none;}
.celebrate-particle{
  position:absolute;
  left:50%;top:50%;
  font-size:22px;
  animation:particleBurst 1.1s ease-out forwards;
  opacity:0;
}
@keyframes particleBurst{
  0%{transform:translate(-50%,-50%) translate(0,0) scale(0.4) rotate(0deg); opacity:1;}
  70%{opacity:1;}
  100%{transform:translate(-50%,-50%) translate(var(--dx), var(--dy)) scale(1.1) rotate(var(--rot)); opacity:0;}
}
.celebrate-card{
  position:relative;
  width:100%;
  max-width:300px;
  background:#FBF9F4;
  border-radius:22px;
  padding:26px 20px 22px;
  display:flex;flex-direction:column;align-items:center;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.35);
  animation:cardPop .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes cardPop{0%{transform:scale(0.75);opacity:0;}100%{transform:scale(1);opacity:1;}}
.celebrate-character{width:120px;margin-bottom:6px;}
.celebrate-message{
  font-size:15px;font-weight:700;color:var(--ink);
  margin-bottom:14px;line-height:1.4;
}
.celebrate-piece-box{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:var(--ivory);
  border-radius:14px;
  padding:14px 18px;
  margin-bottom:16px;
  width:100%;
  box-sizing:border-box;
}
.celebrate-piece-icon{width:56px;height:56px;}
.celebrate-piece-caption{font-size:12px;font-weight:700;color:var(--ink-soft);}
.celebrate-btn{
  background:var(--orange);
  border:none;border-radius:14px;
  color:#FBF9F4;font-family:'Gowun Batang',serif;font-size:14px;font-weight:700;
  padding:12px 0;width:100%;
  cursor:pointer;
}
.celebrate-btn:active{transform:scale(0.98);}
</style>
</head>
<body>
<div class="app">

  <!-- Screen 1: Village map -->
  <section id="map" class="screen active">
    <div class="village-wrap">
      <img class="hero" src="https://raw.githubusercontent.com/gran-seoul-fitness/10-/claude/happy-wozniak-zu6wr0/images/health/village_bg.png">
      <a class="puzzle-entry-btn" onclick="goTo('puzzle')">🧩</a>

      <a class="zone-hit" data-zone="stretch" style="left:9%;top:25.5%;width:30%;height:14%;"></a>
      <a class="zone-hit" data-zone="gx" style="left:56%;top:31.5%;width:34%;height:15%;"></a>
      <a class="zone-hit" data-zone="strength" style="left:9%;top:54%;width:32%;height:14%;"></a>
      <a class="zone-hit" data-zone="cardio" style="left:56%;top:60%;width:33%;height:14%;"></a>
      <a href="health_challenge.html#select" class="zone-hit" style="left:36%;top:35%;width:27%;height:16%;"></a>

      <div class="char-block">
        <div class="speech-bubble" id="speechBubble">오늘도 화이팅! 💪</div>
        <div class="char-mini" id="charMini">
          <svg id="charSvgMini" viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="skinGradMini" cx="38%" cy="30%" r="75%">
                <stop offset="0%" stop-color="#FFF3E4"/>
                <stop offset="55%" stop-color="#FFDDB0"/>
                <stop offset="100%" stop-color="#F2C48C"/>
              </radialGradient>
              <radialGradient id="hatGradMini" cx="40%" cy="30%" r="80%">
                <stop offset="0%" stop-color="#3A3A38"/>
                <stop offset="100%" stop-color="#111110"/>
              </radialGradient>
            </defs>

            <circle cx="99" cy="258" r="14" fill="#F0C79A"/>
            <circle cx="141" cy="258" r="14" fill="#F0C79A"/>

            <g id="outfitGymMini" class="outfit-group show">
              <path d="M 78 205 Q 120 194 162 205 L 154 240 Q 120 250 86 240 Z" fill="#1C1C1A"/>
              <circle cx="100" cy="246" r="10" fill="#F0C79A"/>
              <circle cx="140" cy="246" r="10" fill="#F0C79A"/>
              <path d="M 82 150 Q 120 139 158 150 L 165 206 Q 120 220 75 206 Z" fill="#A2A29A"/>
              <circle cx="76" cy="172" r="17" fill="#8C8C84"/>
              <circle cx="164" cy="172" r="17" fill="#8C8C84"/>
            </g>

            <g id="outfitChimaMini" class="outfit-group">
              <path d="M 78 180 Q 120 168 162 180 L 182 264 Q 120 284 58 264 Z" fill="#1E2233"/>
              <path d="M 96 196 L 92 258" fill="none" stroke="#3A4058" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
              <path d="M 144 196 L 148 258" fill="none" stroke="#3A4058" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
              <path d="M 82 150 Q 120 140 158 150 L 161 181 Q 120 191 79 181 Z" fill="#F5EFDD"/>
              <path d="M 82 150 Q 120 140 158 150" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.85"/>
              <path d="M 108 153 L 120 172 L 132 153" fill="none" stroke="#3D3A32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="110" y="177" width="10" height="9" rx="2" fill="#D85A30"/>
              <path d="M 113 184 Q 106 196 113 208" fill="none" stroke="#D85A30" stroke-width="5" stroke-linecap="round"/>
              <circle cx="113" cy="212" r="2.3" fill="#E8B84B"/>
              <circle cx="113" cy="216.5" r="2.8" fill="#E8B84B"/>
              <circle cx="113" cy="221" r="3.3" fill="#E8B84B"/>
              <g transform="translate(113,229)">
                <ellipse cx="0" cy="-5.5" rx="3.2" ry="5.5" fill="#D85A30" transform="rotate(0)"/>
                <ellipse cx="0" cy="-5.5" rx="3.2" ry="5.5" fill="#D85A30" transform="rotate(90)"/>
                <ellipse cx="0" cy="-5.5" rx="3.2" ry="5.5" fill="#D85A30" transform="rotate(180)"/>
                <ellipse cx="0" cy="-5.5" rx="3.2" ry="5.5" fill="#D85A30" transform="rotate(270)"/>
                <circle r="2.8" fill="#E8B84B"/>
              </g>
              <path d="M 108 235 L 106 248" fill="none" stroke="#D85A30" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M 113 236 L 113 250" fill="none" stroke="#D85A30" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M 118 235 L 120 248" fill="none" stroke="#D85A30" stroke-width="1.8" stroke-linecap="round"/>

function renderGallery(containerEl, missionKey){
  const options = EQUIP_OPTIONS[missionKey] || [];
  const single = options.length <= 1;
  containerEl.innerHTML = options.map(opt => `
    <div class="popup-gallery-item verify-gallery-item" style="width:${single ? '100%' : '68%'};">
      <img src="${EQUIP_DIR + opt.img}">
      <span>${opt.name}</span>
    </div>
  `).join('');
}

/* ---------- Daily certification limit (once per day, like the Sept challenge) ---------- */
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function usedStampToday(){
  try{ return localStorage.getItem('gsf_last_certify_date') === todayStr(); }
  catch(e){ return false; }
}
function markStampToday(){
  try{ localStorage.setItem('gsf_last_certify_date', todayStr()); }catch(e){}
}

function goTo(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
  if(id === 'map') updateProgressUI();
  if(id === 'puzzle') renderPuzzleGrid();
}

let currentZoneKey = null;

document.querySelectorAll('.zone-hit[data-zone]').forEach(zoneEl=>{
  zoneEl.addEventListener('click', ()=>{
    const key = zoneEl.dataset.zone;
    currentZoneKey = key;
    const z = zones[key];
    document.getElementById('missionHero').src = z.bg;
    renderMissionList(key);
    goTo('missions');
  });
});

function renderMissionList(key){
  const z = zones[key];
  const done = getDoneSet();
  const list = document.getElementById('missionList');
  list.innerHTML = '';
  z.missions.forEach((m,i)=>{
    const missionKey = key + '-' + i;
    const isDone = !!done[missionKey];
    const ordinal = ordinalKo[i] || `${i+1}번째`;
    const item = document.createElement('div');
    item.className = 'mission-item' + (isDone ? ' done' : '');
    item.dataset.key = missionKey;
    item.innerHTML = `
      <div class="mission-icon">${isDone ? '✓' : missionIcons[key]}</div>
      <div class="mission-badge">미션 ${ordinal}</div>
      <div class="mission-name-bar">${m}</div>`;
    list.appendChild(item);
  });
}

document.getElementById('missionList').addEventListener('click', (e)=>{
  const item = e.target.closest('.mission-item');
  if(!item) return;
  const key = item.dataset.key;
  const done = getDoneSet();
  if(done[key]){
    setDone(key, false);
    item.classList.remove('done');
    const zoneKey = key.split('-')[0];
    item.querySelector('.mission-icon').innerHTML = missionIcons[zoneKey];
    updateProgressUI();
  } else {
    openMissionPopup(key);
  }
});

/* ---------- Mission verification popup + photo verify screen ---------- */
let currentMissionKey = null;

function missionNameFromKey(key){
  const [zoneKey, idx] = key.split('-');
  return zones[zoneKey].missions[Number(idx)];
}

function openMissionPopup(key){
  currentMissionKey = key;
  const zoneKey = key.split('-')[0];
  const z = zones[zoneKey];
  document.getElementById('popupBadge').textContent = missionNameFromKey(key);
  document.getElementById('popupSets').textContent = `${z.sets} X ${z.reps}씩`;
  renderGallery(document.getElementById('popupGallery'), key);
  document.getElementById('popupVerifyBtn').classList.toggle('disabled', usedStampToday());
  document.getElementById('missionPopup').classList.add('show');
}
function closeMissionPopup(){
  document.getElementById('missionPopup').classList.remove('show');
}

function resetVerifyScreen(){
  const photoBox = document.getElementById('verifyPhoto');
  photoBox.classList.remove('has-photo');
  document.getElementById('verifyPhotoImg').src = '';
  document.getElementById('verifyFileInput').value = '';
  document.getElementById('verifyCheckbox').classList.remove('checked');
}

function goToVerify(){
  if(!currentMissionKey) return;
  if(usedStampToday()) return;
  const zoneKey = currentMissionKey.split('-')[0];
  const z = zones[zoneKey];
  document.getElementById('verifyBadge').textContent = missionNameFromKey(currentMissionKey);
  document.getElementById('verifySets').textContent = `${z.sets} X ${z.reps}씩`;
  renderGallery(document.getElementById('verifyGallery'), currentMissionKey);
  resetVerifyScreen();
  closeMissionPopup();
  goTo('verify');
}

function closeVerify(){
  goTo('missions');
}

document.getElementById('verifyFileInput').addEventListener('change', (e)=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const url = URL.createObjectURL(file);
  document.getElementById('verifyPhotoImg').src = url;
  document.getElementById('verifyPhoto').classList.add('has-photo');
  document.getElementById('verifyCheckbox').classList.add('checked');
});

function toggleVerifyCheckbox(){
  document.getElementById('verifyCheckbox').classList.toggle('checked');
}

function completeVerify(){
  if(!document.getElementById('verifyCheckbox').classList.contains('checked')){
    const box = document.getElementById('verifyCheckbox');
    box.style.transition = 'transform .1s ease';
    box.style.transform = 'translateX(-4px)';
    setTimeout(()=>{ box.style.transform = 'translateX(4px)'; }, 80);
    setTimeout(()=>{ box.style.transform = ''; }, 160);
    return;
  }
  setDone(currentMissionKey, true);
  markStampToday();
  updateProgressUI();
  const zoneKey = currentMissionKey.split('-')[0];
  renderMissionList(zoneKey);
  showCelebration();
}

/* ---------- 십이교 놀이 (12-piece puzzle) ---------- */
const PUZZLE_SHAPES = [
  {name:'큰 세모',      color:'#D85A30', path:'M50,10 L90,90 L10,90 Z'},
  {name:'네모',         color:'#0F6E56', path:'M25,25 L75,25 L75,75 L25,75 Z'},
  {name:'평행사변형',    color:'#AD8A45', path:'M20,80 L50,20 L90,20 L60,80 Z'},
  {name:'작은 세모',     color:'#7C2E22', path:'M50,30 L75,80 L25,80 Z'},
  {name:'사다리꼴',      color:'#3A3835', path:'M30,80 L70,80 L85,30 L15,30 Z'},
  {name:'세모',         color:'#0F6E56', path:'M50,15 L85,85 L15,85 Z'},
  {name:'마름모',        color:'#D85A30', path:'M50,15 L85,50 L50,85 L15,50 Z'},
  {name:'네모',         color:'#AD8A45', path:'M20,20 L80,20 L80,80 L20,80 Z'},
  {name:'세모',         color:'#3A3835', path:'M50,20 L80,80 L20,80 Z'},
  {name:'평행사변형',    color:'#7C2E22', path:'M15,85 L45,15 L85,15 L55,85 Z'},
  {name:'오각형',        color:'#0F6E56', path:'M50,12 L88,40 L74,85 L26,85 L12,40 Z'},
  {name:'세모',         color:'#D85A30', path:'M50,18 L82,82 L18,82 Z'},
];
const celebrateMessages = [
  '오늘도 운동 완료! 정말 멋져요',
  '이 정도면 몸짱 각인데요?',
  '꾸준함이 최고예요, 잘하고 있어요!',
  '땀 흘린 당신, 오늘도 승리!',
  '한 걸음 더 건강해졌어요',
  '역시! 계속 이렇게만 해봐요',
];
function getPuzzlePieces(){
  try{ return JSON.parse(localStorage.getItem('gsf_puzzle_pieces') || '[]'); }
  catch(e){ return []; }
}
function savePuzzlePieces(arr){
  try{ localStorage.setItem('gsf_puzzle_pieces', JSON.stringify(arr)); }catch(e){}
}
function awardRandomPiece(){
  const owned = getPuzzlePieces();
  if(owned.length >= PUZZLE_SHAPES.length) return null;
  const remaining = PUZZLE_SHAPES.map((_,i)=>i).filter(i => !owned.includes(i));
  const pick = remaining[Math.floor(Math.random()*remaining.length)];
  owned.push(pick);
  savePuzzlePieces(owned);
  return pick;
}
function renderPuzzleGrid(){
  const owned = getPuzzlePieces();
  const grid = document.getElementById('puzzleGrid');
  grid.innerHTML = PUZZLE_SHAPES.map((shape,i) => {
    const has = owned.includes(i);
    return `<div class="puzzle-slot${has ? ' filled' : ''}">${
      has ? `<svg viewBox="0 0 100 100"><path d="${shape.path}" fill="${shape.color}"/></svg>` : '<span class="puzzle-slot-q">?</span>'
    }</div>`;
  }).join('');
  document.getElementById('puzzleProgress').textContent = `${owned.length}/${PUZZLE_SHAPES.length} 조각 모음`;
  const playBtn = document.getElementById('puzzlePlayBtn');
  if(owned.length >= PUZZLE_SHAPES.length){
    playBtn.disabled = false;
    playBtn.textContent = '십이교 놀이 시작하기';
  } else {
    playBtn.disabled = true;
    playBtn.textContent = '모든 조각을 모으면 시작할 수 있어요';
  }
}
function renderCelebrationCharacter(){
  const container = document.getElementById('celebrateCharacter');
  const original = document.getElementById('charMini');
  let html = original.outerHTML;
  html = html.replace(/skinGradMini/g, 'skinGradCelebrate').replace(/hatGradMini/g, 'hatGradCelebrate');
  html = html.replace('id="charMini"', 'id="charMiniCelebrate"').replace('id="charSvgMini"', 'id="charSvgCelebrate"');
  html = html.replace('id="outfitGymMini"', 'id="outfitGymCelebrate"').replace('id="outfitChimaMini"', 'id="outfitChimaCelebrate"').replace('id="outfitBajiMini"', 'id="outfitBajiCelebrate"');
  html = html.replace('id="hatGatMini"', 'id="hatGatCelebrate"').replace('id="hatBinyeoMini"', 'id="hatBinyeoCelebrate"');
  container.innerHTML = html;
  let hatKey, outfitKey;
  try{
    hatKey = localStorage.getItem('gsf_hat');
    outfitKey = localStorage.getItem('gsf_outfit');
  }catch(e){}
  const hatMap = { gat: container.querySelector('#hatGatCelebrate'), binyeo: container.querySelector('#hatBinyeoCelebrate') };
  Object.values(hatMap).forEach(el=>el && el.classList.remove('show'));
  if(hatKey && hatMap[hatKey]) hatMap[hatKey].classList.add('show');
  const outfitMap = { gym: container.querySelector('#outfitGymCelebrate'), chima: container.querySelector('#outfitChimaCelebrate'), baji: container.querySelector('#outfitBajiCelebrate') };
  Object.values(outfitMap).forEach(el=>el && el.classList.remove('show'));
  (outfitMap[outfitKey] || outfitMap.gym).classList.add('show');
}
function spawnCelebrationParticles(){
  const container = document.getElementById('celebrateParticles');
  container.innerHTML = '';
  const emojis = ['🌸','🌷','🦋','✨','🌼'];
  const count = 18;
  for(let i = 0; i < count; i++){
    const el = document.createElement('span');
    el.className = 'celebrate-particle';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const angle = Math.random()*Math.PI*2;
    const dist = 80 + Math.random()*120;
    el.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
    el.style.setProperty('--dy', (Math.sin(angle)*dist)+'px');
    el.style.setProperty('--rot', (Math.random()*360-180)+'deg');
    el.style.animationDelay = (Math.random()*0.15)+'s';
    container.appendChild(el);
  }
}
function showCelebration(){
  document.getElementById('celebrateMessage').textContent = celebrateMessages[Math.floor(Math.random()*celebrateMessages.length)];
  const pieceIdx = awardRandomPiece();
  const pieceBox = document.getElementById('celebratePieceBox');
  if(pieceIdx !== null){
    const shape = PUZZLE_SHAPES[pieceIdx];
    document.getElementById('celebratePieceIcon').innerHTML = `<svg viewBox="0 0 100 100"><path d="${shape.path}" fill="${shape.color}"/></svg>`;
    pieceBox.style.display = 'flex';
  } else {
    pieceBox.style.display = 'none';
  }
  renderCelebrationCharacter();
  spawnCelebrationParticles();
  document.getElementById('celebrateOverlay').classList.add('show');
}
function closeCelebration(){
  document.getElementById('celebrateOverlay').classList.remove('show');
  document.getElementById('celebrateParticles').innerHTML = '';
  goTo('missions');
}

/* ---------- Mission progress (localStorage) ---------- */
function getDoneSet(){
  try{ return JSON.parse(localStorage.getItem('gsf_missions_done') || '{}'); }
  catch(e){ return {}; }
}
function setDone(key, val){
  const done = getDoneSet();
  if(val) done[key] = true; else delete done[key];
  try{ localStorage.setItem('gsf_missions_done', JSON.stringify(done)); }catch(e){}
}
function totalMissionCount(){
  return Object.values(zones).reduce((sum,z)=>sum+z.missions.length, 0);
}
function updateProgressUI(){
  const total = totalMissionCount();
  const done = Object.keys(getDoneSet()).length;
  document.getElementById('progressCount').textContent = `${done}/${total}`;
  document.getElementById('progressFill').style.width = (total ? done/total*100 : 0) + '%';
}

/* ---------- Character (restored from health_challenge.html's choice) ---------- */
const hatElsMini = { gat: document.getElementById('hatGatMini'), binyeo: document.getElementById('hatBinyeoMini') };
const outfitElsMini = { gym: document.getElementById('outfitGymMini'), chima: document.getElementById('outfitChimaMini'), baji: document.getElementById('outfitBajiMini') };

function restoreCharacterMini(){
  let hatKey, outfitKey;
  try{
    hatKey = localStorage.getItem('gsf_hat');
    outfitKey = localStorage.getItem('gsf_outfit');
  }catch(e){}
  Object.values(hatElsMini).forEach(el=>el.classList.remove('show'));
  if(hatKey && hatElsMini[hatKey]) hatElsMini[hatKey].classList.add('show');
  Object.values(outfitElsMini).forEach(el=>el.classList.remove('show'));
  outfitElsMini[(outfitKey && outfitElsMini[outfitKey]) ? outfitKey : 'gym'].classList.add('show');
}

/* ---------- D-day ---------- */
const CHALLENGE_END = new Date('2026-10-31T23:59:59+09:00');
function updateDday(){
  const now = new Date();
  const diffDays = Math.ceil((CHALLENGE_END - now) / 86400000);
  document.getElementById('ddayBadge').textContent = diffDays > 0 ? `D-${diffDays}` : 'D-DAY';
}

updateDday();
updateProgressUI();
restoreCharacterMini();
