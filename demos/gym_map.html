<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그랑서울 피트니스 · 고을 지도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
:root{
  --ink:#1C1C1A;
  --ink-soft:#5F5E5A;
  --ivory:#EDE6D6;
  --ivory-light:#F7F5F0;
  --paper2:#E3DBC8;
  --teal:#0F6E56;
  --orange:#D85A30;
  --gold:#AD8A45;
  --hanok-red:#7C2E22;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Gowun Batang',serif;
  background:var(--ivory-light);
  color:var(--ink);
  display:flex;
  justify-content:center;
}
.app{
  width:100%;
  max-width:420px;
  min-height:100vh;
  background:var(--ivory-light);
  position:relative;
  overflow:hidden;
}
.screen{display:none;min-height:100vh;flex-direction:column;position:relative;}
.screen.active{display:flex;}

/* ---------- Map screen ---------- */
#map{padding:0;background:#DED6C4;}
.village-wrap{position:relative;width:100%;}
.village-wrap img.hero{width:100%;display:block;}

.zone-hit{
  position:absolute;
  display:block;
  cursor:pointer;
}
.zone-hit:active{opacity:0.7;}

.gx-patch{
  position:absolute;
  left:63.4%;top:43.9%;width:20.4%;height:2%;
  background:#2C2A26;
  border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.gx-patch span{
  color:#F7F5F0;
  font-weight:700;
  font-size:clamp(10px, 2.9vw, 13px);
  white-space:nowrap;
}

/* ---------- Mission list screen ---------- */
#missions{padding:26px 22px 40px;}
.mission-back{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;color:var(--ink-soft);
  background:none;border:none;cursor:pointer;
  margin-bottom:18px;padding:0;
  font-family:'Gowun Batang',serif;
}
.mission-head{text-align:center;margin-bottom:22px;}
.mission-head .eyebrow{font-size:12px;letter-spacing:3px;margin-bottom:8px;font-weight:700;}
.mission-head h1{font-weight:700;font-size:20px;margin:0;}
.mission-list{display:flex;flex-direction:column;gap:10px;}
.mission-item{
  display:flex;align-items:center;gap:12px;
  border:1px solid #ddd8cc;padding:13px 14px;
  background:#FBF9F4;
}
.mission-num{
  width:26px;height:26px;border:1px solid var(--ink);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex-shrink:0;
}
.mission-name{font-size:14.5px;font-weight:700;}
</style>
</head>
<body>
<div class="app">

  <!-- Screen 1: Village map -->
  <section id="map" class="screen active">
    <div class="village-wrap">
      <img class="hero" src="https://raw.githubusercontent.com/gran-seoul-fitness/10-/claude/happy-wozniak-zu6wr0/images/health/village_bg.png">

      <a class="zone-hit" data-zone="stretch" style="left:9%;top:25.5%;width:30%;height:14%;"></a>
      <a class="zone-hit" data-zone="gx" style="left:56%;top:31.5%;width:34%;height:15%;"></a>
      <a class="zone-hit" data-zone="strength" style="left:9%;top:54%;width:32%;height:14%;"></a>
      <a class="zone-hit" data-zone="cardio" style="left:56%;top:60%;width:33%;height:14%;"></a>
      <a href="health_challenge.html#select" class="zone-hit" style="left:36%;top:35%;width:27%;height:16%;"></a>

      <div class="gx-patch"><span>그룹운동</span></div>
    </div>
  </section>

  <!-- Screen 2: Mission list -->
  <section id="missions" class="screen">
    <button class="mission-back" onclick="goTo('map')">&larr; 고을 지도로 돌아가기</button>
    <div class="mission-head">
      <div class="eyebrow" id="zoneEyebrow"></div>
      <h1 id="zoneTitle"></h1>
    </div>
    <div class="mission-list" id="missionList"></div>
  </section>

</div>

<script>
const zones = {
  stretch: { name:'스트레칭', color:'#AD8A45', missions:['매트 전신 스트레칭','고관절 모빌리티','폼롤러 스트레칭'] },
  gx: { name:'그룹운동', color:'#D85A30', missions:['요가','줌바','필라테스'] },
  strength: { name:'근력', color:'#1C1C1A', missions:['스쿼트','데드리프트','벤치프레스'] },
  cardio: { name:'유산소', color:'#0F6E56', missions:['트레드밀 걷기','사이클 타기','줄넘기'] }
};

function goTo(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

document.querySelectorAll('.zone-hit[data-zone]').forEach(zoneEl=>{
  zoneEl.addEventListener('click', ()=>{
    const key = zoneEl.dataset.zone;
    const z = zones[key];
    document.getElementById('zoneEyebrow').textContent = z.name + ' 존';
    document.getElementById('zoneEyebrow').style.color = z.color;
    document.getElementById('zoneTitle').textContent = z.name + ' 미션';
    const list = document.getElementById('missionList');
    list.innerHTML = '';
    z.missions.forEach((m,i)=>{
      const item = document.createElement('div');
      item.className = 'mission-item';
      item.innerHTML = `<div class="mission-num">${i+1}</div><div class="mission-name">${m}</div>`;
      list.appendChild(item);
    });
    goTo('missions');
  });
});
</script>
</body>
</html>
