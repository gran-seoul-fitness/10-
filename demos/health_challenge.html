<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그랑서울 피트니스 · 4주 건강 챌린지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
@font-face{
  font-family:'HoonminjeongeumH';
  src:url('https://raw.githubusercontent.com/gran-seoul-fitness/10-/claude/happy-wozniak-zu6wr0/fonts/HancomHoonminjeongeumH.woff2') format('woff2');
  font-weight:400 700;
  font-display:swap;
}
:root{
  --ink:#1C1C1A;
  --ink-soft:#5F5E5A;
  --ivory:#EDE6D6;
  --ivory-light:#F7F5F0;
  --paper2:#E3DBC8;
  --teal:#0F6E56;
  --orange:#D85A30;
  --gold:#AD8A45;
  --hanok-red:#7C2E22;
}
*{box-sizing:border-box;}
html{overflow-x:hidden;width:100%;}
body{
  margin:0;
  overflow-x:hidden;
  width:100%;
  font-family:'HoonminjeongeumH','Gowun Batang',serif;
  background:var(--ivory-light);
  color:var(--ink);
  display:flex;
  justify-content:center;
}
.app{
  width:100%;
  max-width:420px;
  min-height:100vh;
  background:var(--ivory-light);
  position:relative;
  overflow:hidden;
}
.screen{display:none;min-height:100vh;flex-direction:column;position:relative;}
.screen.active{display:flex;animation:screenFadeIn .5s ease;}
@keyframes screenFadeIn{
  0%{opacity:0;transform:scale(1.015) translateY(6px);filter:blur(8px);}
  60%{filter:blur(1.5px);}
  100%{opacity:1;transform:scale(1) translateY(0);filter:blur(0);}
}

/* ---------- Tap feedback: smoother, bouncier press for all buttons ---------- */
button, .btn-mini, .btn-quickstart, .btn-start{
  transition:transform .16s cubic-bezier(.34,1.56,.64,1), opacity .16s ease, box-shadow .16s ease;
}

/* ---------- Tap-burst particles (butterflies/flowers when the character is tapped) ---------- */
.tap-burst-particle{
  position:fixed;
  left:0;top:0;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:999;
  animation:tapBurst .9s ease-out forwards;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,0.18));
}
@keyframes tapBurst{
  0%{transform:translate(-50%,-50%) translate(0,0) scale(0.5) rotate(0deg);opacity:1;}
  65%{opacity:1;}
  100%{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(1.15) rotate(var(--rot));opacity:0;}
}
.char-wrap.tapped{animation:charTapPop .5s ease;}
@keyframes charTapPop{
  0%{transform:scale(1) rotate(0deg);}
  35%{transform:scale(1.18) rotate(-6deg);}
  65%{transform:scale(0.95) rotate(4deg);}
  100%{transform:scale(1) rotate(0deg);}
}

/* ---------- Landing ---------- */
#landing{padding:0;background:#C7C3B8;}
.hero-wrap{position:relative;width:100%;}
.hero-wrap img.hero{width:100%;display:block;}

.gate-title{
  position:absolute;
  top:49.8%;left:31.1%;width:39.4%;height:16%;
  z-index:2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;
  padding:4%;
}
.gate-title-text{
  font-weight:700;
  font-size:clamp(11px, 3.1vw, 13.5px);
  line-height:1.5;
  color:var(--ink);
  text-align:center;
}
.btn-mini{
  font-family:'HoonminjeongeumH','Gowun Batang',serif;
  font-weight:700;
  font-size:11.5px;
  color:var(--ivory-light);
  background:var(--ink);
  border:none;
  padding:8px 22px;
  cursor:pointer;
  letter-spacing:0.5px;
  animation:ctaPulse 2.6s ease-in-out infinite;
}
.btn-mini:active{animation-play-state:paused;transform:scale(0.94);}
@keyframes ctaPulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(28,28,26,0.28); }
  50%{ box-shadow:0 0 0 7px rgba(28,28,26,0); }
}

/* ---------- Character select ---------- */
#select{padding:0;background:#C1BDB2;}

.char-box{
  position:absolute;
  top:24.9%;left:10%;width:78.5%;height:54.2%;
  z-index:2;
  display:flex;flex-direction:column;
  padding:6% 7%;
}

.stage{
  position:relative;
  width:100%;
  flex:0 0 auto;
  aspect-ratio:1/0.92;
  margin-bottom:6%;
}
.stage::before{
  content:'';position:absolute;left:50%;bottom:4%;width:56%;height:12px;
  background:rgba(28,28,26,0.14);border-radius:50%;transform:translateX(-50%);filter:blur(2px);
}
.char-wrap{
  position:relative;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  animation:charBob 3s ease-in-out infinite;
}
@keyframes charBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
#charSvg{width:58%;height:auto;overflow:visible;}
.outfit-group{display:none;}
.outfit-group.show{display:block;}
.hat-group{opacity:0;transition:opacity .25s ease;}
.hat-group.show{opacity:1;}

.toast{
  position:absolute;left:50%;bottom:2%;transform:translate(-50%,6px);
  background:var(--ink);color:var(--ivory-light);font-size:10.5px;font-weight:700;
  padding:6px 12px;border-radius:20px;white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

.btn-quickstart{
  display:block;width:100%;
  font-family:'HoonminjeongeumH','Gowun Batang',serif;font-weight:700;font-size:11px;
  color:var(--ivory-light);background:var(--ink);border:none;padding:8px;
  cursor:pointer;letter-spacing:0.3px;margin-bottom:9px;
  animation:ctaPulse 2.6s ease-in-out infinite;
}
.btn-quickstart span{font-size:9.5px;font-weight:400;opacity:0.75;}
.btn-quickstart:active{animation-play-state:paused;transform:scale(0.97);}

.btn-start{
  display:block;width:100%;
  font-family:'HoonminjeongeumH','Gowun Batang',serif;font-weight:700;font-size:13px;
  color:#FBF9F4;background:var(--orange);border:none;border-radius:12px;
  padding:12px;margin-top:14px;
  cursor:pointer;letter-spacing:0.3px;
  box-shadow:0 4px 10px rgba(216,90,48,0.35);
}
.btn-start:active{transform:scale(0.98);}

.divider{
  display:flex;align-items:center;text-align:center;color:var(--ink-soft);
  font-size:9px;letter-spacing:0.5px;margin-bottom:9px;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#c9c2ae;}
.divider span{padding:0 7px;}

.picker-label{font-size:8.5px;letter-spacing:1.5px;color:var(--ink-soft);margin:0 1px 6px;}
.chip-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.chip{
  flex:1;min-width:0;background:rgba(255,255,255,0.55);border:1px solid var(--ink);
  padding:5px 3px;text-align:center;font-size:9px;font-weight:700;cursor:pointer;
  transition:transform .15s ease, background .15s ease;
}
.chip.active{background:var(--ink);color:var(--ivory-light);}
.chip:active{transform:scale(0.96);}

.footer-note{text-align:center;font-size:8.5px;color:var(--ink-soft);line-height:1.5;margin-top:1px;}
</style>
</head>
<body>
<div class="app">

  <!-- Screen 1: Landing -->
  <section id="landing" class="screen active">
    <div class="hero-wrap">
      <img class="hero" src="https://raw.githubusercontent.com/gran-seoul-fitness/10-/claude/happy-wozniak-zu6wr0/images/1.png">
      <div class="gate-title">
        <div class="gate-title-text">10월의<br>건강한 4주를<br>만들어보세요.</div>

                <path d="M 82 150 Q 120 140 158 150" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.85"/>
                <path d="M 108 153 L 120 172 L 132 153" fill="none" stroke="#3D3A32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="110" y="177" width="10" height="9" rx="2" fill="#0F6E56"/>
                <path d="M 113 184 Q 106 196 113 208" fill="none" stroke="#0F6E56" stroke-width="5" stroke-linecap="round"/>
                <circle cx="113" cy="212" r="2.3" fill="#E8B84B"/>
                <circle cx="113" cy="216.5" r="2.8" fill="#E8B84B"/>
                <circle cx="113" cy="221" r="3.3" fill="#E8B84B"/>
                <g transform="translate(113,229)">
                  <ellipse cx="0" cy="-5.5" rx="3.2" ry="5.5" fill="#0F6E56" transform="rotate(0)"/>
                  <ellipse cx="0" cy="-5.5" rx="3.2" ry="5.5" fill="#0F6E56" transform="rotate(90)"/>

                  <ellipse cx="0" cy="-5.5" rx="3.2" ry="5.5" fill="#0F6E56" transform="rotate(270)"/>
                  <circle r="2.8" fill="#E8B84B"/>
                </g>
                <path d="M 108 235 L 106 248" fill="none" stroke="#0F6E56" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M 113 236 L 113 250" fill="none" stroke="#0F6E56" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M 118 235 L 120 248" fill="none" stroke="#0F6E56" stroke-width="1.8" stroke-linecap="round"/>
                <circle cx="76" cy="172" r="16" fill="#F5EFDD"/>
                <circle cx="164" cy="172" r="16" fill="#F5EFDD"/>

              <!-- hands (paws, drawn on top of torso, no arm limb) -->

                <g transform="translate(230,120)">
                  <ellipse cx="0" cy="-7" rx="4" ry="7" fill="#D85A30" transform="rotate(0)"/>
                  <ellipse cx="0" cy="-7" rx="4" ry="7" fill="#D85A30" transform="rotate(72)"/>
                  <ellipse cx="0" cy="-7" rx="4" ry="7" fill="#D85A30" transform="rotate(144)"/>
                  <ellipse cx="0" cy="-7" rx="4" ry="7" fill="#D85A30" transform="rotate(216)"/>
                  <ellipse cx="0" cy="-7" rx="4" ry="7" fill="#D85A30" transform="rotate(288)"/>

              <!-- ears (monkey-style, round and set low on the head) -->
              <circle cx="41" cy="103" r="17" fill="url(#skinGrad)"/>
              <circle cx="199" cy="103" r="17" fill="url(#skinGrad)"/>
              <circle cx="44" cy="103" r="8" fill="#F5A28C" opacity="0.5"/>
              <circle cx="196" cy="103" r="8" fill="#F5A28C" opacity="0.5"/>

              <!-- head -->
              <circle cx="120" cy="95" r="72" fill="url(#skinGrad)"/>

              <!-- eyes -->
              <circle cx="97" cy="97" r="6.5" fill="#241F1B"/>

        <div class="picker-label">옷</div>

          <div class="chip active" data-outfit="gym">운동복</div>

          <div class="chip" data-outfit="baji">바지</div>

        <button class="btn-start" id="startBtn">시작하기</button>

<script>
function goTo(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

const hatEls = { gat: document.getElementById('hatGat'), binyeo: document.getElementById('hatBinyeo') };
const outfitEls = { gym: document.getElementById('outfitGym'), chima: document.getElementById('outfitChima'), baji: document.getElementById('outfitBaji') };

function saveCharacter(hatKey, outfitKey){
  try{
    localStorage.setItem('gsf_hat', hatKey);
    localStorage.setItem('gsf_outfit', outfitKey);
  }catch(e){}
}

document.getElementById('hatRow').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('#hatRow .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  Object.values(hatEls).forEach(el=>el.classList.remove('show'));
  const key = chip.dataset.hat;
  if(hatEls[key]) hatEls[key].classList.add('show');
  saveCharacter(key, document.querySelector('#outfitRow .chip.active').dataset.outfit);
});

document.getElementById('outfitRow').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('#outfitRow .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  Object.values(outfitEls).forEach(el=>el.classList.remove('show'));
  const key = chip.dataset.outfit;
  if(outfitEls[key]) outfitEls[key].classList.add('show');
  saveCharacter(document.querySelector('#hatRow .chip.active').dataset.hat, key);
});

document.getElementById('quickstartBtn').addEventListener('click', ()=>{
  document.querySelectorAll('#hatRow .chip').forEach(c=>c.classList.remove('active'));
  document.querySelector('#hatRow .chip[data-hat="none"]').classList.add('active');
  Object.values(hatEls).forEach(el=>el.classList.remove('show'));

  document.querySelectorAll('#outfitRow .chip').forEach(c=>c.classList.remove('active'));
  document.querySelector('#outfitRow .chip[data-outfit="gym"]').classList.add('active');
  Object.values(outfitEls).forEach(el=>el.classList.remove('show'));
  outfitEls.gym.classList.add('show');
  saveCharacter('none', 'gym');

  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(()=>{ location.href = 'gym_map.html'; }, 900);
});

document.getElementById('startBtn').addEventListener('click', ()=>{
  location.href = 'gym_map.html';
});

(function restoreCharacter(){
  let hatKey, outfitKey;
  try{
    hatKey = localStorage.getItem('gsf_hat');
    outfitKey = localStorage.getItem('gsf_outfit');
  }catch(e){}
  if(hatKey && hatEls[hatKey]){
    document.querySelectorAll('#hatRow .chip').forEach(c=>c.classList.remove('active'));
    document.querySelector(`#hatRow .chip[data-hat="${hatKey}"]`).classList.add('active');
    Object.values(hatEls).forEach(el=>el.classList.remove('show'));
    hatEls[hatKey].classList.add('show');
  }
  if(outfitKey && outfitEls[outfitKey]){
    document.querySelectorAll('#outfitRow .chip').forEach(c=>c.classList.remove('active'));
    document.querySelector(`#outfitRow .chip[data-outfit="${outfitKey}"]`).classList.add('active');
    Object.values(outfitEls).forEach(el=>el.classList.remove('show'));
    outfitEls[outfitKey].classList.add('show');
  }
})();

if (location.hash === '#select') {
  goTo('select');
}

/* ---------- Tap the character: butterflies & flowers pop out ---------- */
let tapBurstIdCounter = 0;
function najeonButterflySVG(uid){
  return `<svg viewBox="0 0 40 32" width="26" height="21">
    <defs>
      <linearGradient id="pearl${uid}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#F8F6F2"/>
        <stop offset="35%" stop-color="#CFE0DE"/>
        <stop offset="65%" stop-color="#D9CBE8"/>
        <stop offset="100%" stop-color="#F0D9E2"/>
      </linearGradient>
    </defs>
    <path d="M20 16 C14 2 2 2 3 12 C4 20 14 20 20 16 Z" fill="url(#pearl${uid})" stroke="#8B93A8" stroke-width="0.6"/>
    <path d="M20 16 C26 2 38 2 37 12 C36 20 26 20 20 16 Z" fill="url(#pearl${uid})" stroke="#8B93A8" stroke-width="0.6"/>
    <path d="M20 16 C15 20 8 26 10 30 C13 32 18 26 20 16 Z" fill="url(#pearl${uid})" stroke="#8B93A8" stroke-width="0.6" opacity="0.9"/>
    <path d="M20 16 C25 20 32 26 30 30 C27 32 22 26 20 16 Z" fill="url(#pearl${uid})" stroke="#8B93A8" stroke-width="0.6" opacity="0.9"/>
    <line x1="20" y1="10" x2="20" y2="20" stroke="#5B5F6E" stroke-width="1.2"/>
  </svg>`;
}
function najeonBlossomSVG(uid){
  return `<svg viewBox="0 0 32 32" width="22" height="22">
    <defs>
      <linearGradient id="pearlB${uid}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#F8F6F2"/>
        <stop offset="40%" stop-color="#E6D6E8"/>
        <stop offset="100%" stop-color="#CFE0DE"/>
      </linearGradient>
    </defs>
    <g fill="url(#pearlB${uid})" stroke="#8B93A8" stroke-width="0.6">
      <ellipse cx="16" cy="7" rx="5" ry="7"/>
      <ellipse cx="25" cy="16" rx="7" ry="5"/>
      <ellipse cx="16" cy="25" rx="5" ry="7"/>
      <ellipse cx="7" cy="16" rx="7" ry="5"/>
    </g>
    <circle cx="16" cy="16" r="3.5" fill="#E9C9A9"/>
  </svg>`;
}
function spawnEmojiBurst(anchorEl){
  const rect = anchorEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const count = 7;
  for(let i = 0; i < count; i++){
    const el = document.createElement('div');
    el.className = 'tap-burst-particle';
    tapBurstIdCounter++;
    el.innerHTML = (i % 2 === 0) ? najeonButterflySVG(tapBurstIdCounter) : najeonBlossomSVG(tapBurstIdCounter);
    const angle = (Math.PI * 2 / count) * i + (Math.random() * 0.5 - 0.25);
    const dist = 50 + Math.random() * 34;
    el.style.left = cx + 'px';
    el.style.top = cy + 'px';
    el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    el.style.setProperty('--dy', (Math.sin(angle) * dist - 24) + 'px');
    el.style.setProperty('--rot', (Math.random() * 80 - 40) + 'deg');
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 950);
  }
}

const charWrapEl = document.querySelector('.char-wrap');
charWrapEl.style.cursor = 'pointer';
charWrapEl.addEventListener('click', () => {
  spawnEmojiBurst(charWrapEl);
  charWrapEl.classList.remove('tapped');
  void charWrapEl.offsetWidth;
  charWrapEl.classList.add('tapped');
});
</script>
