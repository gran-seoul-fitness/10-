<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10월 건강 챌린지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
:root{
  --ink:#1C1C1A;
  --ink-soft:#5F5E5A;
  --ivory:#EDE6D6;
  --ivory-light:#F7F5F0;
  --paper2:#E3DBC8;
  --teal:#0F6E56;
  --orange:#D85A30;
  --gold:#AD8A45;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Gowun Batang',serif;
  background:var(--ivory-light);
  color:var(--ink);
  display:flex;
  justify-content:center;
}
.app{
  width:100%;
  max-width:420px;
  min-height:100vh;
  background:var(--ivory-light);
  position:relative;
  overflow:hidden;
}
.screen{
  display:none;
  min-height:100vh;
  flex-direction:column;
}
.screen.active{display:flex;}

/* ---------- Landing ---------- */
#landing{
  background:linear-gradient(180deg,#F4F3F1 0%,#FBFAF8 100%);
}
.hero-wrap{
  position:relative;
  width:100%;
  overflow:hidden;
}
.hero-wrap img.hero{
  width:100%;
  display:block;
}
.gate-title{
  position:absolute;
  top:57%;
  left:30.6%;
  width:43.4%;
  height:27.5%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:2%;
}
.gate-title-text{
  font-weight:700;
  font-size:clamp(12px, 3.5vw, 15px);
  line-height:1.45;
  color:var(--ink);
  text-shadow:0 1px 8px rgba(255,255,255,0.75), 0 0 2px rgba(255,255,255,0.6);
}
.landing-body{
  padding:22px 26px 40px;
  text-align:center;
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.landing-desc{
  font-weight:400;
  font-size:14px;
  color:#3d3c38;
  line-height:1.8;
  margin-bottom:30px;
}
.btn-primary{
  font-family:'Gowun Batang',serif;
  font-weight:700;
  font-size:15px;
  color:var(--ivory);
  background:var(--ink);
  border:none;
  padding:14px 40px;
  cursor:pointer;
  letter-spacing:1px;
  border-radius:2px;
  animation:ctaPulse 2.6s ease-in-out infinite;
}
@keyframes ctaPulse{
  0%,100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(28,28,26,0.28); }
  50%{ transform:scale(1.045); box-shadow:0 0 0 9px rgba(28,28,26,0); }
}
.btn-primary:active{
  animation-play-state:paused;
  transform:scale(0.94);
  opacity:0.85;
}

/* ---------- Faction select ---------- */
#select{
  position:relative;
  padding:36px 20px 40px;
  background-image:url('https://raw.githubusercontent.com/gran-seoul-fitness/10-/claude/happy-wozniak-zu6wr0/images/quiz/mountains-bg.jpg');
  background-size:cover;
  background-position:center;
}
#select::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(247,245,240,0.75) 0%, rgba(247,245,240,0.9) 45%, rgba(247,245,240,0.96) 100%);
  z-index:0;
}
#select > *{
  position:relative;
  z-index:1;
}
.select-head{
  text-align:center;
  margin-bottom:28px;
}
.select-head .eyebrow{
  font-size:12px;
  letter-spacing:3px;
  color:var(--ink-soft);
  margin-bottom:10px;
}
.select-head h1{
  font-weight:700;
  font-size:21px;
  margin:0;
  line-height:1.5;
}
.faction-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.faction-card{
  position:relative;
  background:rgba(250,247,238,0.92);
  border:1px solid var(--ink);
  padding:20px 10px 16px;
  text-align:center;
  cursor:pointer;
  transition:transform .2s ease, box-shadow .2s ease;
  box-shadow:0 2px 0 rgba(28,28,26,0.08);
}
.faction-card::before,
.faction-card::after{
  content:'';
  position:absolute;
  width:13px;
  height:13px;
  border:1.5px solid var(--gold);
  pointer-events:none;
}
.faction-card::before{top:6px;left:6px;border-right:none;border-bottom:none;}
.faction-card::after{bottom:6px;right:6px;border-left:none;border-top:none;}
.faction-card:hover{
  transform:translateY(-4px) scale(1.02);
  box-shadow:0 10px 20px rgba(28,28,26,0.16);
}
.faction-card:active{
  transform:scale(0.97) translateY(0);
  box-shadow:0 2px 0 rgba(28,28,26,0.08);
}
.faction-card .fig{
  position:relative;
  width:84px;
  height:104px;
  margin:0 auto 8px;
}
.faction-card .fig img.mascot{
  width:100%;
  height:100%;
  object-fit:contain;
  animation:mascotBob 2.6s ease-in-out infinite;
}
.faction-card:nth-child(2) .fig img.mascot{animation-delay:.2s;}
.faction-card:nth-child(3) .fig img.mascot{animation-delay:.4s;}
.faction-card:nth-child(4) .fig img.mascot{animation-delay:.6s;}
@keyframes mascotBob{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-5px);}
}
.prop-badge{
  position:absolute;
  right:-4px;
  bottom:10px;
  width:26px;
  height:26px;
  background:var(--ivory-light);
  border:1px solid var(--ink);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}
.prop-badge svg{width:14px;height:14px;}
.faction-card .fname{
  font-weight:700;
  font-size:18px;
  margin-bottom:4px;
}
.faction-card .flabel{
  font-size:11px;
  color:var(--ink-soft);
  letter-spacing:1px;
  margin-bottom:10px;
}
.faction-card .fbadge{
  display:inline-block;
  font-size:10px;
  font-weight:700;
  padding:3px 12px;
  border-radius:2px;
  transform:rotate(-3deg);
}
.badge-teal{background:var(--teal);color:var(--ivory);}
.badge-orange{background:var(--orange);color:var(--ivory);}
.badge-outline{background:none;border:1px solid var(--ink);color:var(--ink);}
.badge-dashed{background:none;border:1px dashed var(--ink);color:var(--ink);}

/* ---------- Journey transition ---------- */
#journeyOverlay{
  position:fixed;
  inset:0;
  max-width:420px;
  margin:0 auto;
  background-image:url('https://raw.githubusercontent.com/gran-seoul-fitness/10-/claude/happy-wozniak-zu6wr0/images/quiz/mountains-bg.jpg');
  background-size:cover;
  background-position:center;
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  opacity:0;
  transition:opacity .5s ease;
}
#journeyOverlay.active{display:flex;}
#journeyOverlay.show{opacity:1;}
#journeyOverlay::before{
  content:'';
  position:absolute;
  inset:0;
  background:rgba(247,245,240,0.55);
}
.journey-text{
  position:relative;
  z-index:1;
  text-align:center;
  font-weight:700;
  font-size:20px;
  line-height:1.7;
  color:var(--ink);
  padding:0 40px;
  opacity:0;
  transform:translateY(8px);
  transition:opacity .6s ease, transform .6s ease;
}
.journey-text.show{opacity:1;transform:translateY(0);}

/* ---------- Result ---------- */
#result{
  padding:40px 26px;
  text-align:center;
  align-items:center;
  justify-content:center;
}
#result img{
  width:130px;
  margin-bottom:20px;
}
#result .rname{
  font-weight:700;
  font-size:26px;
  margin-bottom:10px;
}
#result .rdesc{
  font-size:14px;
  color:#3d3c38;
  line-height:1.8;
  margin-bottom:28px;
}
.btn-secondary{
  font-family:'Gowun Batang',serif;
  font-size:13px;
  color:var(--ink-soft);
  background:none;
  border:none;
  text-decoration:underline;
  cursor:pointer;
}

/* ---------- Missions ---------- */
#missions{padding:32px 20px 50px;}
.mission-head{text-align:center;margin-bottom:22px;}
.mission-head .eyebrow{font-size:12px;letter-spacing:3px;color:var(--ink-soft);margin-bottom:8px;}
.mission-head h1{font-weight:700;font-size:20px;margin:0;}
.mission-list{display:flex;flex-direction:column;gap:10px;margin-bottom:24px;}
.mission-item{
  display:flex;
  align-items:center;
  gap:12px;
  border:1px solid #ddd8cc;
  padding:12px 14px;
  background:var(--ivory-light);
}
.mission-num{
  width:24px;height:24px;
  border:1px solid var(--ink);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex-shrink:0;
}
.mission-info{flex:1;}
.mission-tag{font-size:10px;color:var(--ink-soft);letter-spacing:1px;margin-bottom:2px;}
.mission-name{font-size:14px;font-weight:700;}
</style>
</head>
<body>
<div class="app">

  <!-- Screen 1: Landing -->
  <section id="landing" class="screen active">
    <div class="hero-wrap">
      <img class="hero" src="https://raw.githubusercontent.com/gran-seoul-fitness/10-/claude/happy-wozniak-zu6wr0/images/challenge/gate-landing.jpg">
      <div class="gate-title">
        <div class="gate-title-text">10월의 건강한<br>4주를 만들어보세요!</div>
      </div>
    </div>
    <div class="landing-body">
      <div class="landing-desc">챌린지 미션을 완료하고<br>건강과 함께<br>리워드도 받아가세요!</div>
      <button class="btn-primary" onclick="goTo('select')">시작하기</button>
    </div>
  </section>

  <!-- Screen 2: Faction select -->
  <section id="select" class="screen">
    <div class="select-head">
      <div class="eyebrow">사신 파벌 선택</div>
      <h1>나의 파벌을<br>골라주세요</h1>
    </div>
    <div class="faction-grid">
      <div class="faction-card" onclick="selectFaction('cheongryong')">
        <div class="fig">
          <img class="mascot" src="https://raw.githubusercontent.com/gran-seoul-fitness/10-/claude/happy-wozniak-zu6wr0/images/challenge/mascot-cheongryong.png">
          <div class="prop-badge" style="color:var(--teal);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 13V9"/><path d="M9 3h6"/></svg>
          </div>
        </div>
        <div class="fname">청룡</div>
        <div class="flabel">유산소파</div>
        <div class="fbadge badge-teal">유산소 60%</div>
      </div>
      <div class="faction-card" onclick="selectFaction('baekho')">
        <div class="fig">
          <img class="mascot" src="https://raw.githubusercontent.com/gran-seoul-fitness/10-/claude/happy-wozniak-zu6wr0/images/challenge/mascot-baekho.png">
          <div class="prop-badge" style="color:var(--ink);">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="9" width="3" height="6" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/><rect x="5" y="11" width="14" height="2"/></svg>
          </div>
        </div>
        <div class="fname">백호</div>
        <div class="flabel">근력파</div>
        <div class="fbadge badge-outline">근력 60%</div>
      </div>
      <div class="faction-card" onclick="selectFaction('jujak')">
        <div class="fig">
          <img class="mascot" src="https://raw.githubusercontent.com/gran-seoul-fitness/10-/claude/happy-wozniak-zu6wr0/images/challenge/mascot-jujak.png">
          <div class="prop-badge" style="color:var(--orange);">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L19 20 L12 16.5 L5 20 Z"/></svg>
          </div>
        </div>
        <div class="fname">주작</div>
        <div class="flabel">GX파</div>
        <div class="fbadge badge-orange">GX 60%</div>
      </div>
      <div class="faction-card" onclick="selectFaction('hyeonmu')">
        <div class="fig">
          <img class="mascot" src="https://raw.githubusercontent.com/gran-seoul-fitness/10-/claude/happy-wozniak-zu6wr0/images/challenge/mascot-hyeonmu.png">
          <div class="prop-badge" style="color:var(--ink);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a4.5 4.5 0 010 9 4.5 4.5 0 000 9"/></svg>
          </div>
        </div>
        <div class="fname">현무</div>
        <div class="flabel">골고루파</div>
        <div class="fbadge badge-dashed">4파 균형</div>
      </div>
    </div>
  </section>

  <!-- Screen 3: Result -->
  <section id="result" class="screen">
    <img id="resultImg" src="">
    <div class="rname" id="resultName"></div>
    <div class="rdesc" id="resultDesc"></div>
    <button class="btn-primary" onclick="showMissions()" style="margin-bottom:14px;">미션 확인하기</button>
    <button class="btn-secondary" onclick="goTo('select')">다시 선택하기</button>
  </section>

  <!-- Screen 4: Missions -->
  <section id="missions" class="screen">
    <div class="mission-head">
      <div class="eyebrow" id="missionFactionLabel"></div>
      <h1>10월의 미션 10가지</h1>
    </div>
    <div class="mission-list" id="missionList"></div>
    <button class="btn-secondary" onclick="goTo('result')" style="display:block;margin:0 auto;">파벌 결과로 돌아가기</button>
  </section>

  <!-- Journey transition overlay -->
  <div id="journeyOverlay">
    <div class="journey-text" id="journeyText"></div>
  </div>

</div>

<script>
const factions = {
  cheongryong: {name:'청룡', desc:'가볍고 빠르게, 순환이 도는<br>유산소 중심 훈련', img:'https://raw.githubusercontent.com/gran-seoul-fitness/10-/claude/happy-wozniak-zu6wr0/images/challenge/mascot-cheongryong.png'},
  baekho: {name:'백호', desc:'묵직하고 곧게, 힘이 도는<br>근력 중심 훈련', img:'https://raw.githubusercontent.com/gran-seoul-fitness/10-/claude/happy-wozniak-zu6wr0/images/challenge/mascot-baekho.png'},
  jujak: {name:'주작', desc:'리듬을 타고 활기차게<br>움직이는 GX 중심 훈련', img:'https://raw.githubusercontent.com/gran-seoul-fitness/10-/claude/happy-wozniak-zu6wr0/images/challenge/mascot-jujak.png'},
  hyeonmu: {name:'현무', desc:'네 파벌을 골고루,<br>균형 잡힌 훈련', img:'https://raw.githubusercontent.com/gran-seoul-fitness/10-/claude/happy-wozniak-zu6wr0/images/challenge/mascot-hyeonmu.png'}
};

const missionSets = {
  cheongryong: [["유산소","사이클 타기"],["유산소","스텝밀(계단오르기)"],["유산소","줄넘기"],["유산소","트레드밀 걷기"],["근력","시티드로우"],["스트레칭","고관절 모빌리티"],["근력","런지"],["유산소","버피 인터벌"],["근력","체스트프레스"],["유산소","로잉머신"]],
  baekho: [["근력","덤벨컬"],["근력","숄더프레스"],["근력","랫풀다운"],["GX","줌바"],["근력","레그컬"],["GX","에어로빅"],["근력","덤벨숄더프레스"],["근력","시티드로우"],["스트레칭","폼롤러 등 스트레칭"],["유산소","트레드밀 걷기"]],
  jujak: [["유산소","사이클 타기"],["GX","요가"],["근력","레그프레스"],["근력","랫풀다운"],["GX","줌바"],["스트레칭","폼롤러 등 스트레칭"],["유산소","버피 인터벌"],["GX","에어로빅"],["GX","스피닝"],["GX","필라테스"]],
  hyeonmu: [["근력","스쿼트"],["유산소","스텝밀(계단오르기)"],["GX","스피닝"],["유산소","줄넘기"],["유산소","로잉머신"],["근력","레그컬"],["스트레칭","매트 전신 스트레칭"],["근력","레그프레스"],["GX","필라테스"],["스트레칭","고관절 모빌리티"]]
};
let currentFaction = 'cheongryong';

function showMissions(){
  const f = factions[currentFaction];
  document.getElementById('missionFactionLabel').textContent = f.name + ' · 10월 미션';
  const list = document.getElementById('missionList');
  list.innerHTML = '';
  missionSets[currentFaction].forEach((m, i)=>{
    const item = document.createElement('div');
    item.className = 'mission-item';
    item.innerHTML = `<div class="mission-num">${i+1}</div><div class="mission-info"><div class="mission-tag">${m[0]}</div><div class="mission-name">${m[1]}</div></div>`;
    list.appendChild(item);
  });
  goTo('missions');
}

function goTo(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function selectFaction(key){
  currentFaction = key;
  const f = factions[key];
  const overlay = document.getElementById('journeyOverlay');
  const text = document.getElementById('journeyText');
  text.innerHTML = f.name + '의 여정이<br>시작됩니다';
  text.classList.remove('show');
  overlay.classList.add('active');

  requestAnimationFrame(()=>{
    overlay.classList.add('show');
    setTimeout(()=> text.classList.add('show'), 150);
  });

  setTimeout(()=>{
    document.getElementById('resultImg').src = f.img;
    document.getElementById('resultName').textContent = f.name;
    document.getElementById('resultDesc').innerHTML = f.desc;
    goTo('result');
    overlay.classList.remove('show');
    text.classList.remove('show');
    setTimeout(()=> overlay.classList.remove('active'), 500);
  }, 1800);
}
</script>
</body>
</html>
