<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한글날 캐릭터 꾸미기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
:root{
  --ink:#1C1C1A;
  --ink-soft:#5F5E5A;
  --ivory:#EDE6D6;
  --ivory-light:#F7F5F0;
  --paper2:#E3DBC8;
  --teal:#0F6E56;
  --orange:#D85A30;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Gowun Batang',serif;
  background:var(--ivory-light);
  color:var(--ink);
  display:flex;
  justify-content:center;
}
.app{
  width:100%;
  max-width:420px;
  min-height:100vh;
  background:var(--ivory-light);
  padding:32px 20px 50px;
}
.head{
  text-align:center;
  margin-bottom:18px;
}
.head .eyebrow{
  font-size:12px;
  letter-spacing:3px;
  color:var(--ink-soft);
  margin-bottom:8px;
}
.head h1{
  font-weight:700;
  font-size:20px;
  margin:0;
  line-height:1.5;
}

.stage{
  position:relative;
  width:100%;
  aspect-ratio:1/1.05;
  background:radial-gradient(ellipse at center 60%, #FBF8F0 0%, var(--paper2) 100%);
  border:1px solid var(--ink);
  margin-bottom:22px;
  overflow:hidden;
}
.stage::before{
  content:'';
  position:absolute;
  left:50%;
  bottom:8%;
  width:56%;
  height:14px;
  background:rgba(28,28,26,0.12);
  border-radius:50%;
  transform:translateX(-50%);
  filter:blur(2px);
}
.char-wrap{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:charBob 3s ease-in-out infinite;
}
@keyframes charBob{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-6px);}
}
#charSvg{
  width:58%;
  height:auto;
  overflow:visible;
  transition:transform .25s ease;
}
.outfit-group{display:none;}
.outfit-group.show{display:block;}
.hat-group{
  opacity:0;
  transition:opacity .25s ease;
}
.hat-group.show{opacity:1;}

.toast{
  position:absolute;
  left:50%;
  bottom:10%;
  transform:translate(-50%,6px);
  background:var(--ink);
  color:var(--ivory-light);
  font-size:12.5px;
  font-weight:700;
  padding:9px 16px;
  border-radius:20px;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

.btn-quickstart{
  display:block;
  width:100%;
  font-family:'Gowun Batang',serif;
  font-weight:700;
  font-size:15px;
  color:var(--ivory-light);
  background:var(--ink);
  border:none;
  padding:15px;
  cursor:pointer;
  letter-spacing:0.5px;
  margin-bottom:16px;
  animation:ctaPulse 2.6s ease-in-out infinite;
}
.btn-quickstart span{
  font-size:12px;
  font-weight:400;
  opacity:0.75;
}
.btn-quickstart:active{
  animation-play-state:paused;
  transform:scale(0.97);
}
@keyframes ctaPulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(28,28,26,0.28); }
  50%{ box-shadow:0 0 0 8px rgba(28,28,26,0); }
}

.divider{
  display:flex;
  align-items:center;
  text-align:center;
  color:var(--ink-soft);
  font-size:11px;
  letter-spacing:1px;
  margin-bottom:20px;
}
.divider::before, .divider::after{
  content:'';
  flex:1;
  height:1px;
  background:#ddd5c2;
}
.divider span{padding:0 10px;}

.picker-label{
  font-size:11px;
  letter-spacing:2px;
  color:var(--ink-soft);
  margin:0 2px 8px;
}
.chip-row{
  display:flex;
  gap:8px;
  margin-bottom:22px;
  flex-wrap:wrap;
}
.chip{
  flex:1;
  min-width:0;
  background:rgba(250,247,238,0.9);
  border:1px solid var(--ink);
  padding:10px 6px;
  text-align:center;
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
  transition:transform .15s ease, background .15s ease;
}
.chip.active{
  background:var(--ink);
  color:var(--ivory-light);
}
.chip:active{transform:scale(0.96);}

.footer-note{
  text-align:center;
  font-size:11px;
  color:var(--ink-soft);
  line-height:1.7;
}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="eyebrow">한글날 기념 이벤트</div>
    <h1>함께 운동할<br>캐릭터를 만들어 보세요</h1>
  </div>

  <div class="stage">
    <div class="char-wrap">
      <svg id="charSvg" viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="skinGrad" cx="38%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#FFF3E4"/>
            <stop offset="55%" stop-color="#FFDDB0"/>
            <stop offset="100%" stop-color="#F2C48C"/>
          </radialGradient>
          <radialGradient id="hatGrad" cx="40%" cy="30%" r="80%">
            <stop offset="0%" stop-color="#3A3A38"/>
            <stop offset="100%" stop-color="#111110"/>
          </radialGradient>
        </defs>

        <!-- feet (shared) -->
        <circle cx="99" cy="258" r="14" fill="#F0C79A"/>
        <circle cx="141" cy="258" r="14" fill="#F0C79A"/>

        <!-- ============ OUTFIT: 운동복 (gym wear) ============ -->
        <g id="outfitGym" class="outfit-group show">
          <path d="M 78 205 Q 120 194 162 205 L 154 240 Q 120 250 86 240 Z" fill="#1C1C1A"/>
          <circle cx="100" cy="246" r="10" fill="#F0C79A"/>
          <circle cx="140" cy="246" r="10" fill="#F0C79A"/>
          <path d="M 82 150 Q 120 139 158 150 L 165 206 Q 120 220 75 206 Z" fill="#A2A29A"/>
          <circle cx="76" cy="172" r="17" fill="#8C8C84"/>
          <circle cx="164" cy="172" r="17" fill="#8C8C84"/>
        </g>

        <!-- ============ OUTFIT: 치마 세트 (jeogori + chima) ============ -->
        <g id="outfitChima" class="outfit-group">
          <path d="M 84 186 Q 120 177 156 186 L 176 264 Q 120 281 64 264 Z" fill="#0F6E56"/>
          <path d="M 82 150 Q 120 140 158 150 L 162 186 Q 120 197 78 186 Z" fill="#F5EFDD" stroke="#E4DABF" stroke-width="1.5"/>
          <path d="M 106 152 L 120 174 L 134 152" fill="none" stroke="#0F6E56" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 110 180 Q 120 190 106 202" fill="none" stroke="#D85A30" stroke-width="6" stroke-linecap="round"/>
          <path d="M 130 180 Q 120 190 134 202" fill="none" stroke="#D85A30" stroke-width="6" stroke-linecap="round"/>
          <circle cx="76" cy="172" r="16" fill="#F5EFDD"/>
          <circle cx="164" cy="172" r="16" fill="#F5EFDD"/>
        </g>

        <!-- ============ OUTFIT: 바지 세트 (jeogori + baji) ============ -->
        <g id="outfitBaji" class="outfit-group">
          <path d="M 84 186 Q 100 179 116 186 L 112 254 Q 96 265 81 254 Z" fill="#1C1C1A"/>
          <path d="M 156 186 Q 140 179 124 186 L 128 254 Q 144 265 159 254 Z" fill="#1C1C1A"/>
          <rect x="86" y="246" width="24" height="8" rx="4" fill="#0F6E56"/>
          <rect x="130" y="246" width="24" height="8" rx="4" fill="#0F6E56"/>
          <path d="M 82 150 Q 120 140 158 150 L 162 189 Q 120 200 78 189 Z" fill="#F5EFDD" stroke="#E4DABF" stroke-width="1.5"/>
          <path d="M 106 152 L 120 174 L 134 152" fill="none" stroke="#D85A30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 110 180 Q 120 190 106 202" fill="none" stroke="#0F6E56" stroke-width="6" stroke-linecap="round"/>
          <path d="M 130 180 Q 120 190 134 202" fill="none" stroke="#0F6E56" stroke-width="6" stroke-linecap="round"/>
          <circle cx="76" cy="172" r="16" fill="#F5EFDD"/>
          <circle cx="164" cy="172" r="16" fill="#F5EFDD"/>
        </g>

        <!-- hands (paws, drawn on top of torso, no arm limb) -->
        <circle cx="60" cy="192" r="19" fill="url(#skinGrad)"/>
        <circle cx="180" cy="192" r="19" fill="url(#skinGrad)"/>

        <!-- head -->
        <circle cx="120" cy="95" r="72" fill="url(#skinGrad)"/>

        <!-- eyes -->
        <circle cx="97" cy="97" r="6.5" fill="#241F1B"/>
        <circle cx="143" cy="97" r="6.5" fill="#241F1B"/>
        <path d="M 86 83 Q 96 77 106 82" fill="none" stroke="#241F1B" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 134 82 Q 144 77 154 83" fill="none" stroke="#241F1B" stroke-width="3.5" stroke-linecap="round"/>

        <!-- nose -->
        <circle cx="120" cy="107" r="4.5" fill="#E8A96E"/>

        <!-- mouth: sideways "3" -->
        <path d="M 104 117 Q 112 126 120 117 Q 128 126 136 117" fill="none" stroke="#241F1B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- cheeks -->
        <ellipse cx="86" cy="114" rx="13" ry="8" fill="#F5A28C" opacity="0.5"/>
        <ellipse cx="154" cy="114" rx="13" ry="8" fill="#F5A28C" opacity="0.5"/>

        <!-- hair: 밤톨머리 (bowl cut, no topknot) -->
        <path d="M 50 88 Q 44 18 120 15 Q 196 18 190 88 Q 190 58 120 58 Q 50 58 50 88 Z" fill="#2B2620"/>

        <!-- gat (hat) overlay -->
        <g id="hatGat" class="hat-group">
          <ellipse cx="120" cy="42" rx="96" ry="16" fill="url(#hatGrad)"/>
          <path d="M 80 38 Q 82 0 120 -2 Q 158 0 160 38 Q 158 14 120 12 Q 82 14 80 38 Z" fill="url(#hatGrad)"/>
          <path d="M 92 50 Q 92 90 84 122" fill="none" stroke="#3A3A38" stroke-width="3" stroke-linecap="round"/>
          <path d="M 148 50 Q 148 90 156 122" fill="none" stroke="#3A3A38" stroke-width="3" stroke-linecap="round"/>
          <circle cx="84" cy="124" r="3.5" fill="#3A3A38"/>
          <circle cx="156" cy="124" r="3.5" fill="#3A3A38"/>
        </g>

        <!-- jeonmo (hat) overlay -->
        <g id="hatJeonmo" class="hat-group">
          <path d="M 26 46 Q 18 -18 120 -22 Q 222 -18 214 46 Q 214 8 120 4 Q 26 8 26 46 Z" fill="#EFE6D2" stroke="#D8CBA8" stroke-width="1.5"/>
          <path d="M 26 46 Q 120 62 214 46 L 214 40 Q 120 56 26 40 Z" fill="#7C2E22"/>
          <path d="M 96 50 Q 96 88 88 120" fill="none" stroke="#7C2E22" stroke-width="3" stroke-linecap="round"/>
          <path d="M 144 50 Q 144 88 152 120" fill="none" stroke="#7C2E22" stroke-width="3" stroke-linecap="round"/>
          <circle cx="88" cy="122" r="3.5" fill="#7C2E22"/>
          <circle cx="152" cy="122" r="3.5" fill="#7C2E22"/>
        </g>
      </svg>
    </div>
    <div class="toast" id="toast">운동복 차림으로 시작할게요!</div>
  </div>

  <button class="btn-quickstart" id="quickstartBtn">바로 시작하기 <span>(기본 운동복)</span></button>
  <div class="divider"><span>또는 직접 꾸며보기</span></div>

  <div class="picker-label">모자</div>
  <div class="chip-row" id="hatRow">
    <div class="chip active" data-hat="none">맨머리</div>
    <div class="chip" data-hat="gat">삿갓</div>
    <div class="chip" data-hat="jeonmo">전모</div>
  </div>

  <div class="picker-label">옷</div>
  <div class="chip-row" id="outfitRow">
    <div class="chip active" data-outfit="gym">운동복</div>
    <div class="chip" data-outfit="chima">치마</div>
    <div class="chip" data-outfit="baji">바지</div>
  </div>

  <div class="footer-note">소품을 선택하면 캐릭터에 바로 입혀져요<br>(프로토타입 · 실제 일러스트로 교체 예정)</div>
</div>

<script>
const hatEls = { gat: document.getElementById('hatGat'), jeonmo: document.getElementById('hatJeonmo') };
const outfitEls = { gym: document.getElementById('outfitGym'), chima: document.getElementById('outfitChima'), baji: document.getElementById('outfitBaji') };

document.getElementById('hatRow').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('#hatRow .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  Object.values(hatEls).forEach(el=>el.classList.remove('show'));
  const key = chip.dataset.hat;
  if(hatEls[key]) hatEls[key].classList.add('show');
});

document.getElementById('outfitRow').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('#outfitRow .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  Object.values(outfitEls).forEach(el=>el.classList.remove('show'));
  const key = chip.dataset.outfit;
  if(outfitEls[key]) outfitEls[key].classList.add('show');
});

document.getElementById('quickstartBtn').addEventListener('click', ()=>{
  document.querySelectorAll('#hatRow .chip').forEach(c=>c.classList.remove('active'));
  document.querySelector('#hatRow .chip[data-hat="none"]').classList.add('active');
  Object.values(hatEls).forEach(el=>el.classList.remove('show'));

  document.querySelectorAll('#outfitRow .chip').forEach(c=>c.classList.remove('active'));
  document.querySelector('#outfitRow .chip[data-outfit="gym"]').classList.add('active');
  Object.values(outfitEls).forEach(el=>el.classList.remove('show'));
  outfitEls.gym.classList.add('show');

  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(()=> toast.classList.remove('show'), 1600);
});
</script>
</body>
</html>
