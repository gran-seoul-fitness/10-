<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한글날 캐릭터 꾸미기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
:root{
  --ink:#1C1C1A;
  --ink-soft:#5F5E5A;
  --ivory:#EDE6D6;
  --ivory-light:#F7F5F0;
  --paper2:#E3DBC8;
  --gold:#AD8A45;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Gowun Batang',serif;
  background:var(--ivory-light);
  color:var(--ink);
  display:flex;
  justify-content:center;
}
.app{
  width:100%;
  max-width:420px;
  min-height:100vh;
  background:var(--ivory-light);
  padding:32px 20px 50px;
}
.head{
  text-align:center;
  margin-bottom:18px;
}
.head .eyebrow{
  font-size:12px;
  letter-spacing:3px;
  color:var(--ink-soft);
  margin-bottom:8px;
}
.head h1{
  font-weight:700;
  font-size:20px;
  margin:0;
  line-height:1.5;
}

.stage{
  position:relative;
  width:100%;
  aspect-ratio:1/1.05;
  background:radial-gradient(ellipse at center 60%, #FBF8F0 0%, var(--paper2) 100%);
  border:1px solid var(--ink);
  margin-bottom:22px;
  overflow:hidden;
}
.stage::before{
  content:'';
  position:absolute;
  left:50%;
  bottom:8%;
  width:56%;
  height:14px;
  background:rgba(28,28,26,0.12);
  border-radius:50%;
  transform:translateX(-50%);
  filter:blur(2px);
}
.char-wrap{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:charBob 3s ease-in-out infinite;
}
@keyframes charBob{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-6px);}
}
#charSvg{
  width:58%;
  height:auto;
  overflow:visible;
  transition:transform .25s ease;
}
.outfit-group, .hat-group{
  opacity:0;
  transform-origin:120px 160px;
  transition:opacity .25s ease;
}
.outfit-group.show, .hat-group.show{opacity:1;}

.picker-label{
  font-size:11px;
  letter-spacing:2px;
  color:var(--ink-soft);
  margin:0 2px 8px;
}
.chip-row{
  display:flex;
  gap:8px;
  margin-bottom:22px;
  flex-wrap:wrap;
}
.chip{
  flex:1;
  min-width:0;
  background:rgba(250,247,238,0.9);
  border:1px solid var(--ink);
  padding:10px 6px;
  text-align:center;
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
  transition:transform .15s ease, background .15s ease;
}
.chip.active{
  background:var(--ink);
  color:var(--ivory-light);
}
.chip:active{transform:scale(0.96);}

.footer-note{
  text-align:center;
  font-size:11px;
  color:var(--ink-soft);
  line-height:1.7;
}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="eyebrow">한글날 기념 이벤트</div>
    <h1>나만의 선비 캐릭터를<br>완성해보세요</h1>
  </div>

  <div class="stage">
    <div class="char-wrap">
      <svg id="charSvg" viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="skinGrad" cx="38%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#FFF3E4"/>
            <stop offset="55%" stop-color="#FFDDB0"/>
            <stop offset="100%" stop-color="#F2C48C"/>
          </radialGradient>
          <radialGradient id="baseCloth" cx="40%" cy="20%" r="90%">
            <stop offset="0%" stop-color="#F7F2E6"/>
            <stop offset="100%" stop-color="#DCD2B8"/>
          </radialGradient>
          <linearGradient id="seonbiGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FBF7EC"/>
            <stop offset="100%" stop-color="#E8DFC8"/>
          </linearGradient>
          <linearGradient id="duruGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4A5A7D"/>
            <stop offset="100%" stop-color="#2E3A56"/>
          </linearGradient>
          <radialGradient id="hatGrad" cx="40%" cy="30%" r="80%">
            <stop offset="0%" stop-color="#3A3A38"/>
            <stop offset="100%" stop-color="#111110"/>
          </radialGradient>
        </defs>

        <!-- feet -->
        <ellipse cx="98" cy="262" rx="20" ry="11" fill="#2B2620"/>
        <ellipse cx="142" cy="262" rx="20" ry="11" fill="#2B2620"/>

        <!-- legs (base) -->
        <rect x="82" y="222" width="30" height="45" rx="14" fill="url(#baseCloth)"/>
        <rect x="128" y="222" width="30" height="45" rx="14" fill="url(#baseCloth)"/>

        <!-- arms (base) -->
        <g id="armLeft">
          <rect x="45" y="170" width="34" height="70" rx="17" fill="url(#skinGrad)" transform="rotate(-8 62 205)"/>
          <circle cx="55" cy="235" r="15" fill="url(#skinGrad)"/>
        </g>
        <g id="armRight">
          <rect x="161" y="170" width="34" height="70" rx="17" fill="url(#skinGrad)" transform="rotate(8 178 205)"/>
          <circle cx="185" cy="235" r="15" fill="url(#skinGrad)"/>
        </g>

        <!-- torso (base) -->
        <path d="M 80 175 Q 80 155 120 155 Q 160 155 160 175 L 165 232 Q 120 248 75 232 Z" fill="url(#baseCloth)"/>
        <path d="M 104 160 L 120 182 L 136 160" fill="none" stroke="#B9AC86" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- seonbi robe overlay -->
        <g id="outfitSeonbi" class="outfit-group">
          <path d="M 70 178 Q 70 150 120 150 Q 170 150 170 178 L 178 236 Q 120 258 62 236 Z" fill="url(#seonbiGrad)" stroke="#C9BC9A" stroke-width="2"/>
          <path d="M 62 236 Q 120 258 178 236 L 174 242 Q 120 262 66 242 Z" fill="#EADFC2"/>
          <path d="M 40 176 Q 42 150 76 168 L 92 214 Q 66 228 46 214 Z" fill="url(#seonbiGrad)" stroke="#C9BC9A" stroke-width="2"/>
          <path d="M 200 176 Q 198 150 164 168 L 148 214 Q 174 228 194 214 Z" fill="url(#seonbiGrad)" stroke="#C9BC9A" stroke-width="2"/>
          <path d="M 104 158 L 120 184 L 136 158" fill="none" stroke="#2C3E50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="76" y="205" width="88" height="9" rx="4.5" fill="#7C2E22"/>
        </g>

        <!-- durumagi overlay -->
        <g id="outfitDuru" class="outfit-group">
          <path d="M 66 178 Q 66 148 120 148 Q 174 148 174 178 L 186 258 Q 120 280 54 258 Z" fill="url(#duruGrad)" stroke="#20283C" stroke-width="2"/>
          <path d="M 54 258 Q 120 280 186 258 L 181 266 Q 120 286 59 266 Z" fill="#232C42"/>
          <path d="M 36 176 Q 38 148 74 166 L 92 216 Q 64 230 42 216 Z" fill="url(#duruGrad)" stroke="#20283C" stroke-width="2"/>
          <path d="M 204 176 Q 202 148 166 166 L 148 216 Q 176 230 198 216 Z" fill="url(#duruGrad)" stroke="#20283C" stroke-width="2"/>
          <path d="M 104 156 L 120 180 L 136 156" fill="none" stroke="#C9A227" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 104 178 Q 118 190 100 208" fill="none" stroke="#C9A227" stroke-width="6" stroke-linecap="round"/>
          <path d="M 136 178 Q 122 190 140 208" fill="none" stroke="#C9A227" stroke-width="6" stroke-linecap="round"/>
        </g>

        <!-- head -->
        <circle cx="120" cy="95" r="72" fill="url(#skinGrad)"/>
        <path d="M 50 92 Q 46 30 120 26 Q 194 30 190 92 Q 190 55 120 52 Q 50 55 50 92 Z" fill="#2B2620"/>
        <circle cx="97" cy="98" r="6" fill="#241F1B"/>
        <circle cx="143" cy="98" r="6" fill="#241F1B"/>
        <path d="M 86 84 Q 96 78 106 83" fill="none" stroke="#241F1B" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 134 83 Q 144 78 154 84" fill="none" stroke="#241F1B" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 106 118 Q 120 128 134 118" fill="none" stroke="#241F1B" stroke-width="3.5" stroke-linecap="round"/>
        <ellipse cx="88" cy="112" rx="13" ry="8" fill="#F5A28C" opacity="0.55"/>
        <ellipse cx="152" cy="112" rx="13" ry="8" fill="#F5A28C" opacity="0.55"/>

        <!-- topknot (sangtu) -->
        <ellipse cx="120" cy="26" rx="10" ry="8" fill="#2B2620"/>

        <!-- gat (hat) overlay -->
        <g id="hatGat" class="hat-group">
          <ellipse cx="120" cy="38" rx="96" ry="16" fill="url(#hatGrad)"/>
          <path d="M 78 34 Q 80 -6 120 -8 Q 160 -6 162 34 Q 160 8 120 6 Q 80 8 78 34 Z" fill="url(#hatGrad)"/>
          <path d="M 92 46 Q 92 88 84 122" fill="none" stroke="#3A3A38" stroke-width="3" stroke-linecap="round"/>
          <path d="M 148 46 Q 148 88 156 122" fill="none" stroke="#3A3A38" stroke-width="3" stroke-linecap="round"/>
          <circle cx="84" cy="124" r="3.5" fill="#3A3A38"/>
          <circle cx="156" cy="124" r="3.5" fill="#3A3A38"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="picker-label">모자</div>
  <div class="chip-row" id="hatRow">
    <div class="chip active" data-hat="none">맨머리</div>
    <div class="chip" data-hat="gat">삿갓</div>
  </div>

  <div class="picker-label">옷</div>
  <div class="chip-row" id="outfitRow">
    <div class="chip active" data-outfit="none">평상복</div>
    <div class="chip" data-outfit="seonbi">선비옷</div>
    <div class="chip" data-outfit="duru">두루마기</div>
  </div>

  <div class="footer-note">소품을 선택하면 캐릭터에 바로 입혀져요<br>(프로토타입 · 실제 일러스트로 교체 예정)</div>
</div>

<script>
const hatEls = { gat: document.getElementById('hatGat') };
const outfitEls = { seonbi: document.getElementById('outfitSeonbi'), duru: document.getElementById('outfitDuru') };

document.getElementById('hatRow').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('#hatRow .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  Object.values(hatEls).forEach(el=>el.classList.remove('show'));
  const key = chip.dataset.hat;
  if(hatEls[key]) hatEls[key].classList.add('show');
});

document.getElementById('outfitRow').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('#outfitRow .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  Object.values(outfitEls).forEach(el=>el.classList.remove('show'));
  const key = chip.dataset.outfit;
  if(outfitEls[key]) outfitEls[key].classList.add('show');
});
</script>
</body>
</html>
